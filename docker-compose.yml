# Canonical convenience entrypoint.
#
# `docker compose up --build` now resolves to the same source-built,
# loopback-bound stack as docker-compose.local.yml. The Windows initializer
# creates .env.local; CI can point this wrapper at .env.example by setting
# HAI_ENV_FILE=.env.example.
name: 018-hai

include:
  - path: ./docker-compose.local.yml
    env_file: ${HAI_ENV_FILE:-.env.local}
