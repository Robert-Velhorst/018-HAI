name: Azure Identity strict source graph preflight

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  strict-sdk-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Azure/azure-sdk-for-js
          ref: ef2a29238eed3348a7d0688f430d405abdbcaab9
          path: .sdk/azure-identity-source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - run: npm install --global npm@12.2.1 --no-audit --no-fund
      - run: npm install --global pnpm@12.16.1 --no-audit --no-fund
      - name: Prepare a strict public stable parent graph without SDK resolver exceptions
        run: python3 scripts/review-azure-identity-strict-source-preflight.py
      - name: Retain all original source, exact SDK metadata changes and raw preflight results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure-identity-strict-source-preflight-evidence
          path: review-output/azure-identity-strict-source/
          if-no-files-found: error
          retention-days: 7
