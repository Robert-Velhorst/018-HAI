name: Current Promptfoo normal graph and original runner evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  normal-current-promptfoo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
      - run: npm install --global npm@12.2.1 --no-audit --no-fund
      - name: Resolve current stable graph normally and retain complete audit and original cases
        run: python3 scripts/review-promptfoo-current-normal-graph.py
      - name: Retain all source, graph, audit and original runner evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promptfoo-current-normal-graph-evidence
          path: ${{ runner.temp }}/promptfoo-current-normal-graph/
          if-no-files-found: error
          retention-days: 7
