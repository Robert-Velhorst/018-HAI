name: Trivy complete stable dependency candidate

on:
  push:
    branches: [fix/hai-trivy-complete-stable-graph-20261025]

permissions:
  contents: read

jobs:
  complete-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Resolve every published stable target and run the complete unchanged upstream suite
        run: python3 -I scripts/prepare_trivy_complete_stable_graph.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-complete-stable-graph-candidate
          path: ${{ runner.temp }}/trivy-full-graph-evidence/
          retention-days: 7
          if-no-files-found: error
