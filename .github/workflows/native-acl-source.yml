name: Fixed ACL source package qualification

on:
  pull_request:
    paths:
      - services/native-acl/**
      - .github/workflows/native-acl-source.yml

permissions:
  contents: read

jobs:
  public-source:
    name: Build fixed ACL packages and run upstream suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
      - name: Prepare only pinned public source inputs
        run: |
          HAI_SOURCE_ROOT="$RUNNER_TEMP/hai-acl-source"
          printf 'HAI_SOURCE_ROOT=%s\n' "$HAI_SOURCE_ROOT" >> "$GITHUB_ENV"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          mkdir -p "$HAI_SOURCE_ROOT/inputs" "$HAI_SOURCE_ROOT/outputs"
          python -I services/native-acl/fetch_source.py "$HAI_SOURCE_ROOT/inputs"
          sha256sum "$HAI_SOURCE_ROOT/inputs/"* > "$HAI_SOURCE_ROOT/input-sha256.txt"
          sudo chown 10001:10001 "$HAI_SOURCE_ROOT/outputs"
      - name: Build isolated public-source SDK image
        run: docker build --file services/native-acl/Dockerfile.sdk --tag hai-acl-source-sdk:ci services/native-acl
      - name: Build candidate Debian packages and retain upstream case results
        timeout-minutes: 45
        run: |
          docker image inspect hai-acl-source-sdk:ci > "$HAI_SOURCE_ROOT/sdk-image-inspect.json"
          docker run --rm --network none --read-only --user 10001:10001 --cap-drop ALL \
            --security-opt no-new-privileges --memory 6g --cpus 2 --pids-limit 256 \
            --tmpfs /build:rw,exec,nosuid,nodev,size=5g,mode=1777 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --mount type=bind,src="$HAI_SOURCE_ROOT/inputs",dst=/inputs,readonly \
            --mount type=bind,src="$HAI_SOURCE_ROOT/outputs",dst=/outputs \
            --env HAI_HOSTED_SOURCE_QUALIFICATION=github-hosted \
            hai-acl-source-sdk:ci
      - name: Retain source, SDK identity, build and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-acl-fixed-package-candidate
          path: ${{ runner.temp }}/hai-acl-source
          if-no-files-found: warn
