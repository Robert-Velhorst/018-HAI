name: Public runner dependency metadata

on:
  pull_request:
    paths:
      - services/miniswe-runner/requirements-port.in
      - services/miniswe-runner/compat/**
      - services/lm-eval-runner/requirements.in
      - services/lm-eval-runner/requirements-port.in
      - services/lm-eval-runner/compat/**
      - services/agent-framework-runner/requirements.in
      - services/guardrails-runner/requirements.in
      - services/guardrails-runner/requirements-port.in
      - services/guardrails-runner/compat/**
      - services/pydantic-ai-runner/requirements.in
      - services/crewai-runner/requirements.in
      - services/ortools-solver/requirements.runtime.in
      - services/ortools-solver/requirements.build.in
      - services/ortools-solver/requirements.runtime-port.in
      - services/ortools-solver/requirements.build-port.in
      - services/ortools-solver/compat/**
      - services/garak-runner/requirements.in
      - services/evidently-runner/requirements.in
      - services/evidently-runner/requirements-port.in
      - services/evidently-runner/compat/**
      - scripts/resolve_runner_lock_metadata.py
      - .github/workflows/runner-lock-metadata.yml

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve public metadata (${{ matrix.runner }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.runner == 'miniswe-runner' && 100 || matrix.runner == 'lm-eval-runner' && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        runner: [miniswe-runner, lm-eval-runner, garak-runner, evidently-runner, agent-framework-runner, guardrails-runner, pydantic-ai-runner, crewai-runner, ortools-runtime, ortools-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
      - name: Resolve source metadata in restricted public-only SDK
        env:
          METADATA_OUTPUT: ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}
          HAI_METADATA_RUNNER: ${{ matrix.runner }}
        run: python scripts/resolve_runner_lock_metadata.py --runner "$HAI_METADATA_RUNNER" --output "$METADATA_OUTPUT"
      - name: Retain generated locks and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-runner-metadata-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/outputs/requirements.lock
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/outputs/requirements.sdk-cases.lock
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/inputs/upstream-case-specs.json
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/inputs/expected-distributions.json
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/inputs/port-spec.json
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/inputs/python-parent-port-specs.json
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/inputs/run_upstream_cases.py
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/inputs/requirements.sdk-cases.in
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/upstream-case-results/*
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/upstream-case-qualification.log
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/port-build.json
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/port-build.log
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/receipt.json
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/resolution.log
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/inputs/*.whl
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/evidently-port-build.json
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/evidently-port-build.log
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/inputs/verify_sdk_import.py
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/qualification/*.json
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/qualification/*.log
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/public-sdk-qualification.log
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/fastuuid-build.json
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/python-parent-port-build.json
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/python-parent-port-build.log
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/fastuuid-build.log
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/fastuuid-preparation.log
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/fastuuid-build/exports/Cargo.lock
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/fastuuid-build/exports/HAI_SOURCE_PORT.json
            ${{ runner.temp }}/public-runner-metadata/${{ matrix.runner }}/fastuuid-build/exports/*-version.txt
          if-no-files-found: error
