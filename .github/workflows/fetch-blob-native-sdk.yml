name: Original Fetch-Blob SDK with native DOMException
on:
  pull_request:
    paths:
      - .github/qualification/fetch-blob-native-domexception.json
      - .github/scripts/fetch_blob_native_sdk.py
      - .github/workflows/fetch-blob-native-sdk.yml
permissions:
  contents: read
jobs:
  original-sdk-current-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      npm_config_engine_strict: 'true'
      npm_config_strict_peer_deps: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: owner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: node-fetch/fetch-blob
          ref: fc7f8e2e5c48a0a1c0fd74179f894df7709112e1
          path: fetch-blob-publisher
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.1'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.2'
      - name: Select current stable npm without bypasses
        run: npm install --global npm@12.2.1
      - name: Preserve all original SDK inputs and execute original test report and build commands
        run: python -B -I owner/.github/scripts/fetch_blob_native_sdk.py
      - name: Retain every source hash actual SDK graph original log and pinned URL fixture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fetch-blob-native-original-sdk
          path: owner/FETCH_BLOB_NATIVE_SDK_EVIDENCE
          if-no-files-found: error
          retention-days: 14
