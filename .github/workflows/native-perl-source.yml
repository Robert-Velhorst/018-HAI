name: Stable Perl original source qualification

on:
  pull_request:
    paths:
      - services/native-perl/**
      - .github/workflows/native-perl-source.yml

permissions:
  contents: read

jobs:
  public-source:
    name: Build Perl and retain its complete original suite
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
      - name: Prepare only the pinned public publisher archive
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          HAI_SOURCE_ROOT="$RUNNER_TEMP/hai-perl-source"
          printf 'HAI_SOURCE_ROOT=%s\n' "$HAI_SOURCE_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$HAI_SOURCE_ROOT/inputs" "$HAI_SOURCE_ROOT/outputs"
          python -I services/native-perl/fetch_source.py "$HAI_SOURCE_ROOT/inputs"
          sha256sum "$HAI_SOURCE_ROOT/inputs/"* > "$HAI_SOURCE_ROOT/input-sha256.txt"
          sudo chown 10001:10001 "$HAI_SOURCE_ROOT/outputs"
      - name: Build disposable original-source SDK
        run: docker build --file services/native-perl/Dockerfile.sdk --tag hai-perl-source-sdk:ci services/native-perl
      - name: Compile unchanged source and invoke every upstream harness case
        timeout-minutes: 85
        run: |
          docker image inspect hai-perl-source-sdk:ci > "$HAI_SOURCE_ROOT/sdk-image-inspect.json"
          docker run --init --rm --network none --read-only --user 10001:10001 --cap-drop ALL \
            --security-opt no-new-privileges --memory 6g --cpus 2 --pids-limit 256 \
            --tmpfs /build:rw,exec,nosuid,nodev,size=4g,mode=1777 \
            --tmpfs /opt/hai-perl:rw,exec,nosuid,nodev,size=1g,mode=1777 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --mount type=bind,src="$HAI_SOURCE_ROOT/inputs",dst=/inputs,readonly \
            --mount type=bind,src="$HAI_SOURCE_ROOT/outputs",dst=/outputs \
            --env HAI_HOSTED_SOURCE_QUALIFICATION=github-hosted \
            hai-perl-source-sdk:ci
      - name: Retain source, SDK identity, full logs and private-prefix evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-perl-original-source-candidate
          path: ${{ runner.temp }}/hai-perl-source
          if-no-files-found: warn
