name: Original Get-URI SDK with current Basic-FTP compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  original-sdk-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TooTallNate/proxy-agents
          ref: b7e5f7ccce1a3ac5b339cc4c587974e8989cbc16
          path: .sdk/get-uri-original
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TooTallNate/proxy-agents
          ref: b7e5f7ccce1a3ac5b339cc4c587974e8989cbc16
          path: .sdk/get-uri-basicftp6
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
      - name: Use the exact publisher SDK package manager
        run: npm install --global pnpm@10.30.3 --no-audit --no-fund
      - name: Compare unchanged publisher SDK commands and private parent compatibility
        run: python3 scripts/review-get-uri-basic-ftp-current-sdk.py
      - name: Retain source, all original command results and private package evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: get-uri-basic-ftp-original-sdk-evidence
          path: ${{ runner.temp }}/get-uri-basic-ftp-original-sdk/
          if-no-files-found: error
          retention-days: 7
