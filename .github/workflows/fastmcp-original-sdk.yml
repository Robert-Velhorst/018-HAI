name: FastMCP original publisher SDK coverage

on:
  pull_request:
    paths:
      - tools/fastmcp-original-sdk/**
      - services/fastmcp-bridge/**
      - .github/workflows/fastmcp-original-sdk.yml

permissions:
  contents: read

jobs:
  sdk_lock_policy:
    uses: ./.github/workflows/fastmcp-sdk-lock-policy.yml
    permissions:
      contents: read

  original_public_cases:
    needs: sdk_lock_policy
    name: Original FastMCP ${{ matrix.test-type }} Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10', test-type: unit-and-serial}
          - {os: ubuntu-latest, python: '3.11', test-type: unit-and-serial}
          - {os: ubuntu-latest, python: '3.12', test-type: unit-and-serial}
          - {os: ubuntu-latest, python: '3.13', test-type: unit-and-serial}
          - {os: ubuntu-latest, python: '3.14', test-type: unit-and-serial}
          - {os: ubuntu-latest, python: '3.15', test-type: unit-and-serial}
          - {os: windows-latest, python: '3.10', test-type: unit-and-serial}
          - {os: windows-latest, python: '3.14', test-type: unit-and-serial}
          - {os: ubuntu-latest, python: '3.10', test-type: conformance}
          - {os: ubuntu-latest, python: '3.15', test-type: conformance}
    steps:
      - name: Preserve canonical Git payload bytes on each platform
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retain complete HAI harness source identity outside the disposable publisher checkout
        shell: bash
        run: python tools/fastmcp-original-sdk/source_guard.py initialise
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PrefectHQ/fastmcp
          ref: 26bf9080ae338d1467dca6471b15c6911f71c75c
          fetch-depth: 1
          persist-credentials: false
      - name: Bind the immutable publisher release tag
        shell: bash
        run: git fetch --depth=1 origin refs/tags/v4.1.4:refs/tags/v4.1.4
      - name: Verify all original publisher cases and inputs before setup
        id: original
        shell: bash
        run: python "$RUNNER_TEMP/hai-fastmcp-original-sdk/source_guard.py" adopt
      - name: Original publisher locked SDK setup
        id: dependencies
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python }}
          resolution: locked
      - name: Original publisher unit tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && matrix.test-type == 'unit-and-serial' }}
        uses: ./.github/actions/run-pytest
      - name: Original publisher serial subprocess tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && matrix.test-type == 'unit-and-serial' }}
        uses: ./.github/actions/run-pytest
        with:
          test-type: client_process
      - name: Original publisher conformance Node setup
        id: conformance_node
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && matrix.test-type == 'conformance' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.1
        with:
          node-version: '24'
      - name: Original publisher conformance tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.conformance_node.outcome == 'success' && matrix.test-type == 'conformance' }}
        uses: ./.github/actions/run-pytest
        with:
          test-type: conformance
      - name: Verify every original source payload after SDK execution
        if: ${{ !cancelled() && steps.original.outcome == 'success' }}
        shell: bash
        run: python "$RUNNER_TEMP/hai-fastmcp-original-sdk/source_guard.py" verify
      - name: Retain complete source evidence even when an original case fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fastmcp-original-${{ matrix.test-type }}-${{ matrix.python }}-${{ runner.os }}
          path: ${{ runner.temp }}/hai-fastmcp-original-sdk/
          if-no-files-found: error
          retention-days: 7

  original_schema_crash:
    needs: sdk_lock_policy
    name: Original FastMCP schema crash test and complete public corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve complete HAI source and schema recorder outside the disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          python tools/fastmcp-original-sdk/source_guard.py initialise
          cp tools/fastmcp-original-sdk/record_schema_dataset.py "$RUNNER_TEMP/hai-fastmcp-original-sdk/record_schema_dataset.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PrefectHQ/fastmcp
          ref: 26bf9080ae338d1467dca6471b15c6911f71c75c
          fetch-depth: 1
          persist-credentials: false
      - name: Bind the immutable publisher release tag
        run: git fetch --depth=1 origin refs/tags/v4.1.4:refs/tags/v4.1.4
      - name: Verify all original publisher inputs before schema setup
        id: original
        run: python "$RUNNER_TEMP/hai-fastmcp-original-sdk/source_guard.py" adopt
      - name: Install current stable SDK resolver
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
      - name: Original publisher Python setup
        run: uv python install 3.12
      - name: Original publisher dependency setup
        run: uv sync
      - name: Original publisher corpus clone
        id: dataset
        run: git clone --depth 1 https://github.com/APIs-guru/openapi-directory.git /tmp/openapi-directory
      - name: Record the initial public dataset identity
        run: python "$RUNNER_TEMP/hai-fastmcp-original-sdk/record_schema_dataset.py" before
      - name: Run the unchanged original schema command and retain its actual exit status
        id: schema_case
        env:
          RUN_REAL_WORLD_SCHEMA_TEST: '1'
          OPENAPI_DIRECTORY_PATH: /tmp/openapi-directory
          DUMP_SCHEMA_FAILURES: /tmp/schema_failures
        shell: bash
        run: |
          set +e
          uv run pytest tests/utilities/json_schema_type/test_real_world_schemas.py -m integration -v -n auto --timeout-method=thread \
            2>&1 | tee "$RUNNER_TEMP/hai-fastmcp-original-sdk/schema-case.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/hai-fastmcp-original-sdk/schema-case.exit-status"
          exit "$status"
      - name: Verify the original pinned dataset and retain raw provider counts
        if: ${{ !cancelled() && steps.schema_case.outcome != 'skipped' && steps.schema_case.outcome != '' }}
        run: python "$RUNNER_TEMP/hai-fastmcp-original-sdk/record_schema_dataset.py" after
      - name: Verify every original publisher source payload after schema execution
        if: ${{ !cancelled() && steps.original.outcome == 'success' }}
        run: python "$RUNNER_TEMP/hai-fastmcp-original-sdk/source_guard.py" verify
      - name: Retain corpus identity and raw results even when an original case fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fastmcp-original-schema-corpus-evidence
          path: ${{ runner.temp }}/hai-fastmcp-original-sdk/
          if-no-files-found: error
          retention-days: 7

  original_packaging_smoke:
    needs: sdk_lock_policy
    name: Complete original packaging smoke with two approved stable-only flags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve HAI source and approved packaging command recorder
        run: |
          set -euo pipefail
          python tools/fastmcp-original-sdk/source_guard.py initialise
          cp tools/fastmcp-original-sdk/record_packaging.py "$RUNNER_TEMP/hai-fastmcp-original-sdk/record_packaging.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PrefectHQ/fastmcp
          ref: 26bf9080ae338d1467dca6471b15c6911f71c75c
          fetch-depth: 1
          persist-credentials: false
      - name: Bind immutable publisher release tag
        run: git fetch --depth=1 origin refs/tags/v4.1.4:refs/tags/v4.1.4
      - name: Verify all publisher payloads and record exact approved command changes
        id: original
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/hai-fastmcp-original-sdk/source_guard.py" adopt
          python "$RUNNER_TEMP/hai-fastmcp-original-sdk/record_packaging.py" before
      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          resolution: locked
      - name: Build package wheels
        run: uv build --all-packages --wheel --out-dir /tmp/fastmcp-dist

      - name: Install bare slim wheel
        run: |
          uv venv /tmp/fastmcp-slim-bare-smoke
          SLIM_WHEEL=$(ls /tmp/fastmcp-dist/fastmcp_slim-*.whl)
          uv pip install --python /tmp/fastmcp-slim-bare-smoke/bin/python "$SLIM_WHEEL"
          /tmp/fastmcp-slim-bare-smoke/bin/python - <<'PY'
          from importlib.metadata import entry_points

          import fastmcp
          import fastmcp.settings

          assert any(ep.name == "fastmcp" for ep in entry_points(group="console_scripts"))

          try:
              from fastmcp.cli import app
          except ImportError as exc:
              assert "FastMCP CLI support is not installed" in str(exc)
          else:
              raise AssertionError(f"bare fastmcp-slim unexpectedly imported CLI app {app!r}")

          try:
              fastmcp.FastMCP
          except ImportError as exc:
              assert "fastmcp-slim[server]" in str(exc)
          else:
              raise AssertionError("bare fastmcp-slim unexpectedly imported FastMCP")
          PY

      - name: Install client slim wheel
        run: |
          uv venv /tmp/fastmcp-slim-client-smoke
          SLIM_WHEEL=$(ls /tmp/fastmcp-dist/fastmcp_slim-*.whl)
          uv pip install --python /tmp/fastmcp-slim-client-smoke/bin/python "${SLIM_WHEEL}[client]"
          /tmp/fastmcp-slim-client-smoke/bin/python - <<'PY'
          from importlib.metadata import entry_points

          from fastmcp import Client
          from fastmcp.client.transports import StdioTransport, StreamableHttpTransport
          from fastmcp.mcp_config import MCPConfig

          assert any(ep.name == "fastmcp" for ep in entry_points(group="console_scripts"))

          try:
              from fastmcp.cli import app
          except ImportError as exc:
              assert "FastMCP CLI support is not installed" in str(exc)
          else:
              raise AssertionError(f"client-only slim unexpectedly imported CLI app {app!r}")

          assert Client("https://example.com/mcp")
          assert StreamableHttpTransport("https://example.com/mcp")
          assert StdioTransport(command="uvx", args=["demo"])
          assert MCPConfig.from_dict({"mcpServers": {"demo": {"url": "https://example.com/mcp"}}})

          try:
              from fastmcp import FastMCP
          except ImportError as exc:
              assert "fastmcp-slim[server]" in str(exc)
          else:
              raise AssertionError(f"client-only slim unexpectedly imported {FastMCP!r}")
          PY

      - name: Install server slim wheel
        run: |
          uv venv /tmp/fastmcp-slim-server-smoke
          SLIM_WHEEL=$(ls /tmp/fastmcp-dist/fastmcp_slim-*.whl)
          uv pip install --python /tmp/fastmcp-slim-server-smoke/bin/python "${SLIM_WHEEL}[server]"
          /tmp/fastmcp-slim-server-smoke/bin/python - <<'PY'
          from importlib.metadata import entry_points

          from fastmcp import FastMCP
          from fastmcp.cli import app

          assert any(
              ep.name == "fastmcp" and ep.value == "fastmcp.cli:app"
              for ep in entry_points(group="console_scripts")
          )

          mcp = FastMCP("smoke")
          assert app is not None
          assert mcp.name == "smoke"
          PY

      - name: Install full package from matching local wheels
        run: |
          uv venv /tmp/fastmcp-full-smoke
          FULL_WHEEL=$(ls /tmp/fastmcp-dist/fastmcp-*.whl)
          uv pip install --python /tmp/fastmcp-full-smoke/bin/python --prerelease=disallow --find-links /tmp/fastmcp-dist "$FULL_WHEEL"
          /tmp/fastmcp-full-smoke/bin/python - <<'PY'
          from importlib.metadata import entry_points
          from importlib.metadata import requires

          from fastmcp import Client, FastMCP
          from fastmcp.client.client import CallToolResult
          from fastmcp.exceptions import ToolError

          fastmcp_reqs = requires("fastmcp") or []
          assert any("fastmcp-slim[client,server]" in req for req in fastmcp_reqs)
          assert not any("fastmcp-slim[full" in req for req in fastmcp_reqs)

          assert any(
              ep.name == "fastmcp" and ep.value == "fastmcp.cli:app"
              for ep in entry_points(group="console_scripts")
          )

          assert Client("https://example.com/mcp")
          assert FastMCP("smoke").name == "smoke"
          assert CallToolResult is not None
          assert ToolError is not None
          PY

      - name: Install fastmcp-remote from matching local wheels
        run: |
          uv venv /tmp/fastmcp-remote-smoke
          REMOTE_WHEEL=$(ls /tmp/fastmcp-dist/fastmcp_remote-*.whl)
          uv pip install --python /tmp/fastmcp-remote-smoke/bin/python --prerelease=disallow --find-links /tmp/fastmcp-dist "$REMOTE_WHEEL"
          /tmp/fastmcp-remote-smoke/bin/python - <<'PY'
          from importlib.metadata import entry_points
          from importlib.metadata import requires

          from fastmcp_remote.cli import build_parser

          remote_reqs = requires("fastmcp-remote") or []
          assert any("fastmcp-slim[client,server]" in req for req in remote_reqs)
          assert any(
              ep.name == "fastmcp-remote" and ep.value == "fastmcp_remote.cli:main"
              for ep in entry_points(group="console_scripts")
          )
          assert build_parser().prog == "fastmcp-remote"
          PY
      - name: Retain wheel and installed-distribution evidence even on failure
        if: ${{ !cancelled() && steps.original.outcome == 'success' }}
        run: python "$RUNNER_TEMP/hai-fastmcp-original-sdk/record_packaging.py" after
      - name: Verify every original publisher payload after packaging
        if: ${{ !cancelled() && steps.original.outcome == 'success' }}
        run: python "$RUNNER_TEMP/hai-fastmcp-original-sdk/source_guard.py" verify
      - name: Retain raw packaging and complete source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fastmcp-original-packaging-stable-only
          path: ${{ runner.temp }}/hai-fastmcp-original-sdk/
          if-no-files-found: error
          retention-days: 7

  complete_coverage_gate:
    name: Complete original SDK coverage remains required
    if: always()
    needs: [sdk_lock_policy, original_public_cases, original_schema_crash, original_packaging_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse to promote partial coverage to complete SDK qualification
        env:
          OBSERVED_JOBS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          spec=json.loads(Path('tools/fastmcp-original-sdk/spec.json').read_text())
          observed=json.loads(os.environ['OBSERVED_JOBS'])
          missing=list(spec['required_gates_not_qualified_by_this_public_matrix'])
          for reason,job in spec.get('implemented_coverage_jobs',{}).items():
              if observed.get(job,{}).get('result')=='success':
                  missing.remove(reason)
          result={'observed_jobs':observed,
                  'required_unqualified_gates':missing,'complete_original_SDK_qualified':False}
          Path('fastmcp-original-SDK-coverage.json').write_text(json.dumps(result,indent=2)+'\n')
          for reason in missing:
              print(reason)
          raise SystemExit(1 if missing else 0)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fastmcp-original-complete-coverage-gate
          path: fastmcp-original-SDK-coverage.json
          if-no-files-found: error
          retention-days: 7
