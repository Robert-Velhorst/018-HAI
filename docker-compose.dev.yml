# Optional behavior-only development override.
#
# Use after generating .env.local:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Ports, databases, networks, and source builds remain owned by the canonical
# topology. This override does not add duplicate infrastructure or mount source
# over the static runtime binary.
services:
  backend:
    environment:
      GIN_MODE: debug
      RUN_MODE: development
