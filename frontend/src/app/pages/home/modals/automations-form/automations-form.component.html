<section>
  <nz-modal
    [(nzVisible)]="isVisible"
    [nzTitle]="modalTitle"
    (nzOnCancel)="closeModal()"
    [nzOkDisabled]="automationForm.invalid || submitting"
    [nzOkLoading]="submitting"
    [nzClosable]="!submitting"
    [nzKeyboard]="!submitting"
    [nzMaskClosable]="!submitting"
    (nzOnOk)="onSubmit()"
    nzOkText="Save"
  >
    <ng-container *nzModalContent>
      <form nz-form [formGroup]="automationForm">
        <nz-form-item>
          <nz-form-label [nzSpan]="5" nzRequired>Name</nz-form-label>
          <nz-form-control
            nzErrorTip="The automation name must be a maximum of 50 characters."
            [nzSpan]="12"
            nzHasFeedback
          >
            <input
              nz-input
              formControlName="name"
              placeholder="Enter automation name"
            />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSpan]="5" nzRequired>Hostname</nz-form-label>
          <nz-form-control
            nzErrorTip="The automation hostname must be a maximum of 50 characters."
            [nzSpan]="12"
            nzHasFeedback
          >
            <input
              nz-input
              formControlName="host"
              placeholder="Enter automation hostname"
            />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSpan]="5" nzRequired>Port</nz-form-label>
          <nz-form-control
            nzErrorTip="The automation port must be a number between 1 and 65535."
            [nzSpan]="12"
            nzHasFeedback
          >
            <input
              type="number"
              nz-input
              formControlName="port"
              placeholder="Enter automation port"
            />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSpan]="5">Runtime</nz-form-label>
          <nz-form-control [nzSpan]="12">
            <nz-select formControlName="runtimeType">
              <nz-option nzValue="browser" nzLabel="Browser/API"></nz-option>
              <nz-option nzValue="docker" nzLabel="Docker service"></nz-option>
              <nz-option nzValue="script" nzLabel="Local script"></nz-option>
              <nz-option nzValue="mcp" nzLabel="MCP"></nz-option>
              <nz-option nzValue="openclaw" nzLabel="OpenClaw"></nz-option>
              <nz-option nzValue="qwenpaw" nzLabel="QwenPaw"></nz-option>
              <nz-option nzValue="deepseek-harness" nzLabel="DeepSeek Harness"></nz-option>
              <nz-option nzValue="hermes" nzLabel="Hermes Agent"></nz-option>
              <nz-option nzValue="odysseus" nzLabel="Odysseus"></nz-option>
              <nz-option nzValue="anythingllm" nzLabel="AnythingLLM"></nz-option>
              <nz-option nzValue="khoj" nzLabel="Khoj"></nz-option>
              <nz-option nzValue="librechat" nzLabel="LibreChat"></nz-option>
              <nz-option nzValue="agent-zero" nzLabel="Agent Zero"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSpan]="5">Launch type</nz-form-label>
          <nz-form-control [nzSpan]="12">
            <nz-select formControlName="launchType">
              <nz-option nzValue="browser_url" nzLabel="Browser URL"></nz-option>
              <nz-option nzValue="docker_service" nzLabel="Docker service"></nz-option>
              <nz-option nzValue="script" nzLabel="Local script"></nz-option>
              <nz-option nzValue="api" nzLabel="API call"></nz-option>
              <nz-option nzValue="agent_runtime" nzLabel="Controlled agent runtime"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
        <nz-form-item *ngIf="automationForm.value.runtimeType === 'openclaw' && automationForm.value.launchType === 'agent_runtime'">
          <nz-form-label [nzSpan]="5" nzFor="runtime-model">Start model</nz-form-label>
          <nz-form-control [nzSpan]="18" nzErrorTip="Use provider/model, up to 255 characters.">
            <input nz-input id="runtime-model" formControlName="runtimeModel" placeholder="Gateway default" maxlength="255"
              aria-describedby="runtime-model-help" />
            <small id="runtime-model-help">Optional. Requires an allowed model. Gateway fallback policy still applies.</small>
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSpan]="5">Launch target</nz-form-label>
          <nz-form-control [nzSpan]="12">
            <input nz-input formControlName="launchTarget" placeholder="https://localhost/app or service name" />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSpan]="5">Service name</nz-form-label>
          <nz-form-control [nzSpan]="12">
            <input nz-input formControlName="serviceName" placeholder="Docker Compose service name" />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSpan]="5">Route path</nz-form-label>
          <nz-form-control [nzSpan]="12">
            <input nz-input formControlName="routePath" placeholder="/my-automation" />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSpan]="5">Public URL</nz-form-label>
          <nz-form-control [nzSpan]="12">
            <input nz-input formControlName="publicUrl" placeholder="https://example.com" />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSpan]="5">Local URL</nz-form-label>
          <nz-form-control [nzSpan]="12">
            <input nz-input formControlName="localUrl" placeholder="http://localhost:3000" />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSpan]="5">Health type</nz-form-label>
          <nz-form-control [nzSpan]="12">
            <nz-select formControlName="healthCheckType">
              <nz-option nzValue="http" nzLabel="HTTP"></nz-option>
              <nz-option nzValue="tcp" nzLabel="TCP"></nz-option>
              <nz-option nzValue="manual" nzLabel="Manual"></nz-option>
              <nz-option nzValue="disabled" nzLabel="Disabled"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSpan]="5">Health target</nz-form-label>
          <nz-form-control [nzSpan]="12">
            <input nz-input formControlName="healthCheckUrl" placeholder="http://service:port/healthz" />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSpan]="5">Expected status</nz-form-label>
          <nz-form-control [nzSpan]="12">
            <input type="number" nz-input formControlName="expectedHttpStatus" />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSpan]="5">Dependency notes</nz-form-label>
          <nz-form-control [nzSpan]="12">
            <textarea nz-input formControlName="dependencyNotes" rows="3"></textarea>
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSpan]="5">Image</nz-form-label>
          <nz-form-control [nzSpan]="12">
            <ng-container *ngIf="!removeImage">
              <nz-upload
                nzType="drag"
                [nzMultiple]="false"
                nzName="image"
                [nzBeforeUpload]="beforeUpload"
              >
                <p class="ant-upload-drag-icon">
                  <i nz-icon nzType="inbox"></i>
                </p>
                <p class="ant-upload-text">
                  Click or drag image to this area to upload
                </p>
              </nz-upload>
            </ng-container>
            <!-- <button class="ant-button-remove-image" nz-button></button> -->
            <ng-container *ngIf="removeImage">
              <div class="ant-upload-text__information">
                <span nz-icon nzType="clear" nzTheme="outline"></span>
                <button
                  type="button"
                  class="ant-button-remove-image"
                  (click)="deleteImage()"
                  style="color: green"
                >
                  Image Removed
                </button>
              </div>
            </ng-container>
            <ng-container *ngIf="!removeImage">
              <div class="ant-upload-text__information">
                <span nz-icon nzType="delete" nzTheme="outline"></span>
                <button
                  type="button"
                  class="ant-button-remove-image"
                  (click)="deleteImage()"
                >
                  Remove Image
                </button>
              </div>
            </ng-container>
          </nz-form-control>
        </nz-form-item>
      </form>
    </ng-container>
    <ng-container *nzModalFooter>
      <button nz-button nzType="default" [disabled]="submitting" (click)="closeModal()">Cancel</button>
      <button
        nz-button
        nzType="primary"
        [disabled]="automationForm.invalid || submitting"
        (click)="onSubmit()"
        class="save-button"
      >
        <i nz-icon nzType="save"></i> Save
      </button>
    </ng-container>
  </nz-modal>
</section>
