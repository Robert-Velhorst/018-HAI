<section class="hai-app-shell" [class.hai-app-shell--compact]="navigationMode === 'compact'" [class.hai-app-shell--expanded]="navigationMode === 'expanded'">
  <a class="hai-skip-link" href="#hai-main">Skip to content</a>

  <aside class="hai-navigation" [class.hai-navigation--open]="mobileNavigationOpen" aria-label="HAI navigation">
    <button type="button" class="hai-brand" (click)="navigate(modules[0])" title="Open Command Center">
      <span>HAI</span>
      <strong>Automation Hub</strong>
    </button>

    <nav>
      <section class="hai-navigation__group" *ngFor="let group of groups; trackBy: trackGroup">
        <h2>{{ group.label }}</h2>
        <button
          type="button"
          class="hai-navigation__item"
          *ngFor="let module of groupModules(group.id); trackBy: trackModule"
          [class.hai-navigation__item--active]="isActive(module)"
          [attr.aria-current]="isActive(module) ? 'page' : null"
          [attr.title]="module.title + ': ' + module.description"
          (click)="navigate(module)"
        >
          <i nz-icon [nzType]="module.icon" nzTheme="outline"></i>
          <span>{{ module.title }}</span>
        </button>
      </section>
    </nav>
  </aside>

  <button type="button" class="hai-navigation-backdrop" aria-label="Close navigation" *ngIf="mobileNavigationOpen" (click)="mobileNavigationOpen = false"></button>

  <div class="hai-workspace">
    <header class="hai-global-bar">
      <button type="button" class="hai-icon-control hai-mobile-menu" aria-label="Open navigation" (click)="mobileNavigationOpen = !mobileNavigationOpen">
        <i nz-icon nzType="menu" nzTheme="outline"></i>
      </button>
      <button type="button" class="hai-safety-status" title="Safe mode is active. High-risk actions require approval." (click)="openRoute('/ambient-brain')">
        <i nz-icon nzType="safety-certificate" nzTheme="outline"></i>
        <span><strong>Safe mode</strong><small>Approval-gated</small></span>
      </button>
      <div class="hai-module-identity">
        <strong>{{ current.title }}</strong>
        <small>{{ current.description }}</small>
      </div>
      <div class="hai-global-bar__spacer"></div>
      <button type="button" class="hai-utility-control" [attr.aria-pressed]="viewMode === 'advanced'" (click)="toggleViewMode()" title="Toggle the saved basic or advanced view for this module">
        <i nz-icon [nzType]="viewMode === 'advanced' ? 'compress' : 'expand'" nzTheme="outline"></i>
        <span>{{ viewMode === 'advanced' ? 'Advanced' : 'Basic' }}</span>
      </button>
      <button type="button" class="hai-icon-control" [attr.title]="navigationLabel()" [attr.aria-label]="navigationLabel()" (click)="cycleNavigationMode()">
        <i nz-icon nzType="menu-fold" nzTheme="outline"></i>
      </button>
      <button type="button" class="hai-icon-control" [attr.title]="'Switch to ' + (themeMode === 'dark' ? 'light' : 'dark') + ' theme'" [attr.aria-label]="'Switch to ' + (themeMode === 'dark' ? 'light' : 'dark') + ' theme'" (click)="toggleTheme()">
        <i nz-icon [nzType]="themeMode === 'dark' ? 'eye-invisible' : 'bulb'" nzTheme="outline"></i>
      </button>
    </header>

    <main id="hai-main" class="hai-module-outlet" [attr.data-hai-module]="current.id">
      <router-outlet></router-outlet>
    </main>
  </div>
</section>
