<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HAI Automation Hub</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      var mode = 'dark';
      try {
        mode = localStorage.getItem('hai-theme-mode') || localStorage.getItem('hai-control-center-theme') || 'dark';
      } catch (_) {}
      mode = mode === 'light' ? 'light' : 'dark';
      var themeClass = 'hai-theme-' + mode;
      document.documentElement.classList.add(themeClass);
      document.documentElement.setAttribute('data-hai-theme', mode);
      document.documentElement.style.colorScheme = mode;
    }());
  </script>
</head>
<body>
  <app-root>
    <div style="min-height:100vh;display:grid;place-items:center;background:#08111f;color:#edf4ff;font-family:Arial,sans-serif">
      <div style="text-align:center">
        <strong style="display:block;font-size:20px;margin-bottom:8px">HAI Automation Hub</strong>
        <span>Loading command center...</span>
      </div>
    </div>
  </app-root>
</body>
</html>
