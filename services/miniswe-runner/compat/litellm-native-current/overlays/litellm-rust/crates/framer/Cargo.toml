[package]
name = "litellm-framer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["aws", "sse"]
aws = ["dep:aws-smithy-eventstream", "dep:aws-smithy-types"]
sse = []

[dependencies]
aws-smithy-eventstream = { version = "=0.61.6", optional = true }
aws-smithy-types = { version = "1.9.0", optional = true }
bytes = "1.12.1"
futures-util.workspace = true
thiserror.workspace = true
tokio-util = { version = "0.7.20", features = ["codec", "io"] }

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true
tokio.workspace = true
