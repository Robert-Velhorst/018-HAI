[package]
name = "litellm-auth-aws"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
litellm-auth-types.workspace = true
litellm-http.workspace = true

moka = { workspace = true, features = ["sync"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

aws-config = { version = "1.13.0", default-features = false, features = ["rustls", "rt-tokio"] }
aws-credential-types = { version = "1.3.1", features = ["hardcoded-credentials"] }
aws-sdk-sts = { version = "1.122.0", default-features = false, features = ["rustls", "rt-tokio"] }
aws-sigv4 = "1.6.3"
aws-types = "1.7.0"
aws-smithy-runtime-api = "1.19.1"

[dev-dependencies]
rstest.workspace = true
litellm-http = { workspace = true, features = ["test-support"] }
reqwest.workspace = true
tokio.workspace = true
