    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${IDP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - idp-network

  postgres-automation:
    # Pinned upstream pgvector Postgres 17 image. Existing data stays in the
    # named volume; take a backup before changing a live database image.
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    container_name: 018-hai-postgres-automation
    hostname: postgres-automation
    restart: unless-stopped
    # Give Postgres time to checkpoint and close cleanly during upgrades.
    stop_grace_period: 120s
    mem_limit: ${POSTGRES_AUTOMATION_MEMORY_LIMIT:-768m}
    cpus: ${POSTGRES_AUTOMATION_CPU_LIMIT:-1.0}
    pids_limit: ${POSTGRES_AUTOMATION_PIDS_LIMIT:-192}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${AUTOMATION_DB_NAME}
    ports:
      - "127.0.0.1:${AUTOMATION_DB_HOST_PORT:-5434}:5432"
    volumes:
      - postgres-automation-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${AUTOMATION_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - automation-hub-network

  redis:
    image: redis:7-alpine
    container_name: 018-hai-redis
    hostname: redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-128m}
    cpus: ${REDIS_CPU_LIMIT:-0.25}
    pids_limit: ${REDIS_PIDS_LIMIT:-64}
    command: ["redis-server", "--port", "${REDIS_PORT}"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:${REDIS_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      # Also on automation-hub-network so the backend can reach it: Redis was
      # previously idp-network only, unreachable from the backend, which is why
      # nothing but the IDP ever used it.
      - idp-network
      - automation-hub-network

  kafka:
    # Redpanda implements Kafka's protocol without the separate ZooKeeper or
    # Java broker footprint. Existing clients keep the kafka:9092 contract.
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1@sha256:9a47c1f8d6736f98fa2616f0b715c051cb0bdac1a1176e38321bf45a5b572d
    profiles: ["event-bus"]
    container_name: 018-hai-kafka
    hostname: kafka
    restart: unless-stopped
    mem_limit: ${KAFKA_MEMORY_LIMIT:-256m}
    mem_reservation: ${KAFKA_MEMORY_RESERVATION:-64m}
    cpus: ${KAFKA_CPU_LIMIT:-0.5}
    pids_limit: ${KAFKA_PIDS_LIMIT:-96}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://kafka:9092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - kafka:33145
      - --smp
      - "1"
      - --overprovisioned=true
      - --unsafe-bypass-fsync=false
      - --lock-memory=false
      - --reserve-memory
      - 0M
      - --check=false
      - --default-log-level
      - warn
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=127.0.0.1:9092"]
      interval: 30s
      timeout: 5s
      retries: 18
      start_period: 15s
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - service-hub

  generic-auto:
    # Legacy compatibility service. It is not part of the operational HAI
    # path, so keep it opt-in instead of spending local resources at startup.
    profiles: ["compatibility"]
    build:
      context: ./generic-auto
      dockerfile: dockerfile
    container_name: 018-hai-generic-auto
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - service-hub

  # Local HTTP compatibility fixture for the LLM probe and generation contract.
  # It is not an LLM, downloads no models, makes no external requests, and is
  # excluded from the default Windows stack. Run it only with the
  # `provider-fixture` profile and explicitly point a test-only HAI provider at
  # http://provider-fixture:11434.
  provider-fixture:
    profiles: ["provider-fixture"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: provider-fixture
    container_name: 018-hai-provider-fixture
    hostname: provider-fixture
    restart: "no"
    read_only: true
    mem_limit: 32m
    cpus: 0.10
    pids_limit: 32
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "/provider-fixture", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s
    networks:
      - service-hub

networks:
  idp-network:
