    name: 018-hai-evidently-internal
    driver: bridge
    internal: true
  guardrails-internal:
    name: 018-hai-guardrails-internal
    driver: bridge
    internal: true
  lm-eval-internal:
    name: 018-hai-lm-eval-internal
    driver: bridge
    internal: true
  promptfoo-internal:
    name: 018-hai-promptfoo-internal
    driver: bridge
    internal: true
  deepteam-internal:
    name: 018-hai-deepteam-internal
    driver: bridge
    internal: true
  deepeval-internal:
    name: 018-hai-deepeval-internal
    driver: bridge
    internal: true
  garak-internal:
    name: 018-hai-garak-internal
    driver: bridge
    internal: true
  whispercpp-internal:
    name: 018-hai-whispercpp-internal
    driver: bridge
    internal: true
  pydantic-ai-internal:
    name: 018-hai-pydantic-ai-internal
    driver: bridge
    internal: true
  fastmcp-internal:
    name: 018-hai-fastmcp-internal
    driver: bridge
    internal: true
  security-runners-internal:
    name: 018-hai-security-runners-internal
    driver: bridge
    internal: true
  agent-runners-internal:
    name: 018-hai-agent-runners-internal
    driver: bridge
    internal: true
  document-runners-internal:
    name: 018-hai-document-runners-internal
    driver: bridge
    internal: true
  coding-runners-internal:
    name: 018-hai-coding-runners-internal
    driver: bridge
    internal: true

volumes:
  postgres-idp-data:
    name: 018-hai-postgres-idp-data
  postgres-automation-data:
    name: 018-hai-postgres-automation-data
  redis-data:
    name: 018-hai-redis-data
  redpanda-data:
    name: 018-hai-redpanda-data
  phase2-control-state:
    name: 018-hai-phase2-control-state
  temporal-postgres-data:
    name: 018-hai-temporal-postgres-data
  runner-ollama-data:
    name: 018-hai-runner-ollama-data
  ollama-local-data:
    name: 018-hai-ollama-local-data
