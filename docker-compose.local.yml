services:
  idp:
    build:
      context: ./idp
      dockerfile: Dockerfile
    container_name: 018-hai-idp
    hostname: idp
    restart: unless-stopped
    # Leave time for the 90-second HTTP drain and owned-client cleanup.
    stop_grace_period: 120s
    mem_limit: ${IDP_MEMORY_LIMIT:-256m}
    cpus: ${IDP_CPU_LIMIT:-0.5}
    pids_limit: ${IDP_PIDS_LIMIT:-128}
    depends_on:
      postgres-idp:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RUN_MODE: ${RUN_MODE:-production}
      BLOCKING_TIME_EXPONENTIATION_BASIS: ${BLOCKING_TIME_EXPONENTIATION_BASIS}
      MAX_LOGIN_ATTEMPTS_BEFORE_BLOCK: ${MAX_LOGIN_ATTEMPTS_BEFORE_BLOCK}
      MIN_TIME_BETWEEN_ATTEMPTS_IN_SECONDS: ${MIN_TIME_BETWEEN_ATTEMPTS_IN_SECONDS}
      EXPIRATION_TIME_RESET_TOKEN_IN_HOURS: ${EXPIRATION_TIME_RESET_TOKEN_IN_HOURS}
      ACCESS_TOKEN_DURATION_MINUTES: ${ACCESS_TOKEN_DURATION_MINUTES}
      REFRESH_TOKEN_DURATION_DAYS: ${REFRESH_TOKEN_DURATION_DAYS}
      PASSWORD_RESET_TOPIC: ${PASSWORD_RESET_TOPIC}
      ACCOUNT_BLOCKED_TOPIC: ${ACCOUNT_BLOCKED_TOPIC}
      ACCOUNT_CREATED_TOPIC: ${ACCOUNT_CREATED_TOPIC}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_ADDR: ${REDIS_ADDR}
      HAI_EVENT_BUS_ENABLED: ${HAI_EVENT_BUS_ENABLED:-false}
      LOGGER_TOPIC: ${LOGGER_TOPIC}
      MAIL_TOPIC: ${MAIL_TOPIC}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID}
      BROKERS_ADDR: ${BROKERS_ADDR}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${IDP_DB_NAME}
      DB_HOST: ${IDP_DB_HOST}
      IDP_DB_STARTUP_TIMEOUT: ${IDP_DB_STARTUP_TIMEOUT:-5m}
      DB_PORT: ${DB_PORT}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      # Plaintext is allowed only for this local Compose Postgres host; remote
      # production database hosts still require verify-ca or verify-full.
      HAI_LOCAL_COMPOSE_DATABASE: "true"
      WEB_SERVER_PORT: ${WEB_SERVER_PORT}
      BASE_URL: ${BASE_URL}
      FIRST_RUN_ADMIN_EMAIL: ${FIRST_RUN_ADMIN_EMAIL}
      FIRST_RUN_ADMIN_PASSWORD: ${FIRST_RUN_ADMIN_PASSWORD}
      IDP_COOKIE_SECURE: ${IDP_COOKIE_SECURE}
      LOCAL_LOGIN_BYPASS_ENABLED: ${LOCAL_LOGIN_BYPASS_ENABLED:-false}
      LOCAL_PREVIEW_GATEWAY_SECRET: ${LOCAL_PREVIEW_GATEWAY_SECRET:-}
      # The IDP validates a numeric loopback bind and a dedicated gateway secret
      # before enabling local preview; request headers cannot establish trust.
      GATEWAY_HOST_BIND: ${GATEWAY_HOST_BIND:-127.0.0.1}
      # "Sign in with Google": the client id/secret are shared with the backend's
      # Gmail connector, but the login redirect is a distinct path routed to the
      # IDP, so it needs its own registered redirect URI on the Google app.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_LOGIN_REDIRECT_URL: ${GOOGLE_LOGIN_REDIRECT_URL:-}
      # Password-recovery mail is unavailable until these are configured.
      # Use STARTTLS (normally port 587); do not expose this account publicly.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REQUIRE_STARTTLS: ${SMTP_REQUIRE_STARTTLS:-true}
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/${WEB_SERVER_PORT}; printf \"GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; IFS=\" \" read -r _ status _ <&3; test \"$$status\" = 200'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - service-hub
      - idp-network

  backend:
    image: "${COMPOSE_PROJECT_NAME:-hai}-backend:local"
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 018-hai-backend
    hostname: backend
    restart: unless-stopped
    # Allow HTTP drain (20s), owned worker drain (20s), and pool cleanup.
    stop_grace_period: 60s
    # The API keeps enough headroom for migrations and bounded ingestion while
    # preventing an idle local installation from consuming a desktop unchecked.
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    cpus: ${BACKEND_CPU_LIMIT:-1.0}
    pids_limit: ${BACKEND_PIDS_LIMIT:-256}
    depends_on:
      postgres-automation:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
      backend-runtime-role:
        condition: service_completed_successfully
      backend-state-permissions:
        condition: service_completed_successfully
      idp:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT}
      BASE_URL: ${BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      BACKEND_API_SHARED_KEY: ${BACKEND_API_SHARED_KEY}
      HAI_MEMORY_ENCRYPTION_KEY: ${HAI_MEMORY_ENCRYPTION_KEY}
      HAI_APPROVAL_PROOF_SIGNING_KEY: ${HAI_APPROVAL_PROOF_SIGNING_KEY}
      # The API may use a DML-only runtime role. Schema changes are applied
      # separately with the DB_USER owner account; see docs/migrations.md.
      DB_USER: ${BACKEND_DB_USER:-hai_runtime}
      DB_PASSWORD: ${BACKEND_DB_PASSWORD:-${DB_PASSWORD}}
      DB_NAME: ${AUTOMATION_DB_NAME}
      DB_HOST: ${AUTOMATION_DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      # Plaintext is allowed only for this local Compose Postgres host; remote
      # production database hosts still require verify-ca or verify-full.
      HAI_LOCAL_COMPOSE_DATABASE: "true"
      DB_MIGRATIONS_ENABLED: ${DB_MIGRATIONS_ENABLED:-false}
      HAI_COMMAND_TIMEOUT: ${HAI_COMMAND_TIMEOUT:-30m}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-8}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-2}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-2m}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5s}
      DB_OPEN_TIMEOUT: ${DB_OPEN_TIMEOUT:-10s}
      DB_STARTUP_TIMEOUT: ${DB_STARTUP_TIMEOUT:-5m}
      # Versioned migrations are authoritative in production. AutoMigrate is
      # retained only for deliberate development work.
      DB_AUTOMIGRATE: ${DB_AUTOMIGRATE:-false}
      IMAGE_MAX_SIZE_IN_MB: ${IMAGE_MAX_SIZE_IN_MB}
      IMAGE_EXTENSIONS: ${IMAGE_EXTENSIONS}
      IMAGE_SAVE_DIR: ${IMAGE_SAVE_DIR}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      HAI_EVENT_BUS_ENABLED: ${HAI_EVENT_BUS_ENABLED:-false}
      REDIS_ADDR: ${REDIS_ADDR}
      # Google OAuth (Gmail, Drive, Contacts, and Calendar). Empty by default;
      # when unset all four report unavailable instead of simulating access.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-}
      HAI_OAUTH_TOKEN_ENCRYPTION_KEY: ${HAI_OAUTH_TOKEN_ENCRYPTION_KEY:-}
      HAI_OAUTH_STATE_SIGNING_KEY: ${HAI_OAUTH_STATE_SIGNING_KEY:-}
      # Per-client-IP request cap per minute; 0 disables it. Enforced through
      # Redis (REDIS_ADDR) so the count survives restarts and is shared across
      # instances. Was previously not passed through, so the limiter could never
      # be enabled regardless of .env.
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE}
      RUN_MODE: ${RUN_MODE:-production}
      HAI_PROMETHEUS_ENABLED: ${HAI_PROMETHEUS_ENABLED}
      HAI_PROMETHEUS_TOKEN: ${HAI_PROMETHEUS_TOKEN}
      LLM_POLICY_JSON: ${LLM_POLICY_JSON}
      LLM_PROVIDERS_JSON: ${LLM_PROVIDERS_JSON}
      LLM_REQUIRE_RECENT_LIVE_PROBE: ${LLM_REQUIRE_RECENT_LIVE_PROBE}
      LLM_PROVIDER_PROBE_MAX_AGE_SECONDS: ${LLM_PROVIDER_PROBE_MAX_AGE_SECONDS}
      LLM_PROVIDER_PROBE_TIMEOUT_SECONDS: ${LLM_PROVIDER_PROBE_TIMEOUT_SECONDS:-5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL_IDS: ${OLLAMA_MODEL_IDS:-}
      LLM_MODEL_MAINTENANCE_ENABLED: ${LLM_MODEL_MAINTENANCE_ENABLED:-true}
      LLM_MODEL_MAINTENANCE_INTERVAL_HOURS: ${LLM_MODEL_MAINTENANCE_INTERVAL_HOURS:-24}
      LLM_MODEL_MAINTENANCE_TIMEOUT_SECONDS: ${LLM_MODEL_MAINTENANCE_TIMEOUT_SECONDS:-900}
      LLM_MODEL_MAINTENANCE_FAILURE_RETRY_MINUTES: ${LLM_MODEL_MAINTENANCE_FAILURE_RETRY_MINUTES:-5}
      LLM_MODEL_MAINTENANCE_SCHEDULER_ENABLED: ${LLM_MODEL_MAINTENANCE_SCHEDULER_ENABLED:-true}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL}
      LM_STUDIO_MODEL_ID: ${LM_STUDIO_MODEL_ID:-local-model}
      LLAMA_CPP_BASE_URL: ${LLAMA_CPP_BASE_URL}
      LLAMA_CPP_MODEL_ID: ${LLAMA_CPP_MODEL_ID}
      LOCALAI_BASE_URL: ${LOCALAI_BASE_URL}
      LOCALAI_MODEL_ID: ${LOCALAI_MODEL_ID}
      VLLM_BASE_URL: ${VLLM_BASE_URL}
      VLLM_MODEL_ID: ${VLLM_MODEL_ID}
      SGLANG_BASE_URL: ${SGLANG_BASE_URL:-}
      SGLANG_MODEL_ID: ${SGLANG_MODEL_ID:-sglang-default}
      DSPARK_ENABLED: ${DSPARK_ENABLED:-false}
      DSPARK_BASE_URL: ${DSPARK_BASE_URL:-}
      DSPARK_PROBE_PATH: ${DSPARK_PROBE_PATH:-/v1/models}
      DSPARK_GENERATION_PATH: ${DSPARK_GENERATION_PATH:-/v1/chat/completions}
      DSPARK_MODEL_ID: ${DSPARK_MODEL_ID:-dspark-default}
      MISTRAL_RS_BASE_URL: ${MISTRAL_RS_BASE_URL}
      MISTRAL_RS_MODEL_ID: ${MISTRAL_RS_MODEL_ID}
      LITELLM_ENABLED: ${LITELLM_ENABLED}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL}
      LITELLM_MODEL_ID: ${LITELLM_MODEL_ID}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      HAI_SEMANTIC_RETRIEVAL_ENABLED: ${HAI_SEMANTIC_RETRIEVAL_ENABLED}
      HAI_EMBEDDING_BASE_URL: ${HAI_EMBEDDING_BASE_URL}
      HAI_EMBEDDING_MODEL: ${HAI_EMBEDDING_MODEL}
      HAI_EMBEDDING_API_KEY: ${HAI_EMBEDDING_API_KEY:-}
      HAI_EMBEDDING_INPUT_LIMIT: ${HAI_EMBEDDING_INPUT_LIMIT}
      HAI_EMBEDDING_TIMEOUT_SECONDS: ${HAI_EMBEDDING_TIMEOUT_SECONDS}
      # Optional internal-only OR-Tools planner. It emits proposals only and
      # cannot apply workflow, calendar, filesystem, or external changes.
      HAI_PLANNING_OPTIMIZER_ENABLED: ${HAI_PLANNING_OPTIMIZER_ENABLED}
      HAI_PLANNING_OPTIMIZER_BASE_URL: ${HAI_PLANNING_OPTIMIZER_BASE_URL}
      HAI_PLANNING_OPTIMIZER_TIMEOUT_SECONDS: ${HAI_PLANNING_OPTIMIZER_TIMEOUT_SECONDS}
      HAI_TEMPORAL_ENABLED: ${HAI_TEMPORAL_ENABLED}
      HAI_TEMPORAL_ADDRESS: ${HAI_TEMPORAL_ADDRESS}
      HAI_TEMPORAL_NAMESPACE: ${HAI_TEMPORAL_NAMESPACE}
      HAI_TEMPORAL_TASK_QUEUE: ${HAI_TEMPORAL_TASK_QUEUE}
      HAI_PLAYWRIGHT_ENABLED: ${HAI_PLAYWRIGHT_ENABLED}
      HAI_PLAYWRIGHT_RUNNER_URL: ${HAI_PLAYWRIGHT_RUNNER_URL}
      HAI_PLAYWRIGHT_RUNNER_TOKEN: ${HAI_PLAYWRIGHT_RUNNER_TOKEN:-}
      HAI_PLAYWRIGHT_PROFILES: ${HAI_PLAYWRIGHT_PROFILES}
      HAI_SEARXNG_ENABLED: ${HAI_SEARXNG_ENABLED}
      HAI_SEARXNG_BASE_URL: ${HAI_SEARXNG_BASE_URL}
      HAI_RAGFLOW_ENABLED: ${HAI_RAGFLOW_ENABLED}
      HAI_RAGFLOW_BASE_URL: ${HAI_RAGFLOW_BASE_URL}
      HAI_RAGFLOW_API_KEY: ${HAI_RAGFLOW_API_KEY:-}
      HAI_RAGFLOW_DATASET_IDS: ${HAI_RAGFLOW_DATASET_IDS:-}
      HAI_ANYTHINGLLM_ENABLED: ${HAI_ANYTHINGLLM_ENABLED:-false}
      HAI_ANYTHINGLLM_BASE_URL: ${HAI_ANYTHINGLLM_BASE_URL:-http://host.docker.internal:3001}
      HAI_ANYTHINGLLM_API_KEY: ${HAI_ANYTHINGLLM_API_KEY:-}
      HAI_ANYTHINGLLM_WORKSPACE_SLUGS: ${HAI_ANYTHINGLLM_WORKSPACE_SLUGS:-}
      HAI_ANYTHINGLLM_LOCAL_EMBEDDINGS_CONFIRMED: ${HAI_ANYTHINGLLM_LOCAL_EMBEDDINGS_CONFIRMED:-false}
      HAI_SERENA_ENABLED: ${HAI_SERENA_ENABLED:-false}
      HAI_SERENA_BASE_URL: ${HAI_SERENA_BASE_URL:-http://host.docker.internal:9121/mcp}
      HAI_SERENA_PROJECT_ID: ${HAI_SERENA_PROJECT_ID:-}
      HAI_ODOO_ENABLED: ${HAI_ODOO_ENABLED:-false}
      HAI_ODOO_BASE_URL: ${HAI_ODOO_BASE_URL:-}
      HAI_ODOO_DATABASE: ${HAI_ODOO_DATABASE:-}
      HAI_ODOO_API_KEY: ${HAI_ODOO_API_KEY:-}
      HAI_ODOO_ALLOWED_MODELS: ${HAI_ODOO_ALLOWED_MODELS:-crm.lead,project.task}
      HAI_ODOO_SYNC_LIMIT: ${HAI_ODOO_SYNC_LIMIT:-20}
      HAI_SHARET_ENABLED: ${HAI_SHARET_ENABLED:-false}
      HAI_SHARET_BASE_URL: ${HAI_SHARET_BASE_URL:-}
      HAI_SHARET_CONNECTOR_TOKEN: ${HAI_SHARET_CONNECTOR_TOKEN:-}
      HAI_SHARET_SYNC_LIMIT: ${HAI_SHARET_SYNC_LIMIT:-1000}
      HAI_AIRBYTE_ENABLED: ${HAI_AIRBYTE_ENABLED:-false}
      HAI_AIRBYTE_BASE_URL: ${HAI_AIRBYTE_BASE_URL:-}
      HAI_AIRBYTE_API_KEY: ${HAI_AIRBYTE_API_KEY:-}
      HAI_AIRBYTE_WORKSPACE_IDS: ${HAI_AIRBYTE_WORKSPACE_IDS:-}
      HAI_LARO_ENABLED: ${HAI_LARO_ENABLED:-false}
      HAI_LARO_BASE_URL: ${HAI_LARO_BASE_URL:-}
      HAI_LARO_CONNECTOR_TOKEN: ${HAI_LARO_CONNECTOR_TOKEN:-}
      HAI_LARO_SYNC_LIMIT: ${HAI_LARO_SYNC_LIMIT:-50}
      HAI_WORKER_CONTROL_ENABLED: ${HAI_WORKER_CONTROL_ENABLED:-false}
      HAI_WORKER_CONTROL_BASE_URL: ${HAI_WORKER_CONTROL_BASE_URL:-}
      HAI_WORKER_CONTROL_CONNECTOR_TOKEN: ${HAI_WORKER_CONTROL_CONNECTOR_TOKEN:-}
      HAI_WORKER_CONTROL_SYNC_LIMIT: ${HAI_WORKER_CONTROL_SYNC_LIMIT:-50}
      HAI_CLOUDQUERY_SUMMARY_ENABLED: ${HAI_CLOUDQUERY_SUMMARY_ENABLED:-false}
      HAI_CLOUDQUERY_ALLOWED_ROOT: ${HAI_CLOUDQUERY_ALLOWED_ROOT:-/cloudquery-summary}
      HAI_CLOUDQUERY_SUMMARY_PATH: ${HAI_CLOUDQUERY_SUMMARY_PATH:-/cloudquery-summary/summary.jsonl}
      HAI_CLOUDQUERY_MAX_ENTRIES: ${HAI_CLOUDQUERY_MAX_ENTRIES:-50}
      HAI_PRESIDIO_ENABLED: ${HAI_PRESIDIO_ENABLED}
      HAI_PRESIDIO_BASE_URL: ${HAI_PRESIDIO_BASE_URL}
      HAI_PRESIDIO_LANGUAGE: ${HAI_PRESIDIO_LANGUAGE}
      HAI_PRESIDIO_ENTITIES: ${HAI_PRESIDIO_ENTITIES}
      HAI_EVIDENTLY_ENABLED: ${HAI_EVIDENTLY_ENABLED}
      HAI_EVIDENTLY_BASE_URL: ${HAI_EVIDENTLY_BASE_URL}
      HAI_EVIDENTLY_TIMEOUT_SECONDS: ${HAI_EVIDENTLY_TIMEOUT_SECONDS}
      HAI_GUARDRAILS_ENABLED: ${HAI_GUARDRAILS_ENABLED}
      HAI_GUARDRAILS_BASE_URL: ${HAI_GUARDRAILS_BASE_URL}
      HAI_GUARDRAILS_TIMEOUT_SECONDS: ${HAI_GUARDRAILS_TIMEOUT_SECONDS}
      HAI_PYDANTIC_AI_ENABLED: ${HAI_PYDANTIC_AI_ENABLED:-false}
      HAI_PYDANTIC_AI_BASE_URL: ${HAI_PYDANTIC_AI_BASE_URL:-http://pydantic-ai-runner:8080}
      HAI_PYDANTIC_AI_TIMEOUT_SECONDS: ${HAI_PYDANTIC_AI_TIMEOUT_SECONDS:-20}
      # Optional FastMCP read-only context bridge. The backend never receives
      # the MCP client token; it accepts only this separate service token and
      # returns bounded workflow summaries for one explicitly configured owner.
      HAI_FASTMCP_BRIDGE_ENABLED: ${HAI_FASTMCP_BRIDGE_ENABLED:-false}
      HAI_FASTMCP_BRIDGE_TOKEN: ${HAI_FASTMCP_BRIDGE_TOKEN:-}
      HAI_FASTMCP_BRIDGE_OWNER_ID: ${HAI_FASTMCP_BRIDGE_OWNER_ID:-}
      # Local A2A planning protocol subset. This token protects the direct
      # JSON-RPC endpoint; no browser session or generic backend API key is
      # accepted, and the endpoint can only return a planning draft.
      HAI_A2A_BRIDGE_ENABLED: ${HAI_A2A_BRIDGE_ENABLED:-false}
      HAI_A2A_BRIDGE_TOKEN: ${HAI_A2A_BRIDGE_TOKEN:-}
      HAI_A2A_BRIDGE_OWNER_ID: ${HAI_A2A_BRIDGE_OWNER_ID:-}
      HAI_A2A_BRIDGE_URL: ${HAI_A2A_BRIDGE_URL:-http://127.0.0.1:8091/api/v1/a2a}
      HAI_LM_EVAL_ENABLED: ${HAI_LM_EVAL_ENABLED:-false}
      HAI_LM_EVAL_BASE_URL: ${HAI_LM_EVAL_BASE_URL:-http://lm-eval-runner:8080}
      HAI_LM_EVAL_TIMEOUT_SECONDS: ${HAI_LM_EVAL_TIMEOUT_SECONDS:-130}
      HAI_PROMPTFOO_ENABLED: ${HAI_PROMPTFOO_ENABLED:-false}
      HAI_PROMPTFOO_BASE_URL: ${HAI_PROMPTFOO_BASE_URL:-http://promptfoo-runner:8080}
      HAI_PROMPTFOO_TIMEOUT_SECONDS: ${HAI_PROMPTFOO_TIMEOUT_SECONDS:-130}
      HAI_DEEPTEAM_ENABLED: ${HAI_DEEPTEAM_ENABLED:-false}
      HAI_DEEPTEAM_BASE_URL: ${HAI_DEEPTEAM_BASE_URL:-http://deepteam-runner:8080}
      HAI_DEEPTEAM_TIMEOUT_SECONDS: ${HAI_DEEPTEAM_TIMEOUT_SECONDS:-180}
      HAI_DEEPEVAL_ENABLED: ${HAI_DEEPEVAL_ENABLED:-false}
      HAI_DEEPEVAL_BASE_URL: ${HAI_DEEPEVAL_BASE_URL:-http://deepeval-runner:8080}
      HAI_DEEPEVAL_TIMEOUT_SECONDS: ${HAI_DEEPEVAL_TIMEOUT_SECONDS:-180}
      HAI_GARAK_ENABLED: ${HAI_GARAK_ENABLED:-false}
      HAI_GARAK_BASE_URL: ${HAI_GARAK_BASE_URL:-http://garak-runner:8080}
      HAI_GARAK_TIMEOUT_SECONDS: ${HAI_GARAK_TIMEOUT_SECONDS:-150}
      HAI_WHISPER_CPP_ENABLED: ${HAI_WHISPER_CPP_ENABLED:-false}
      HAI_WHISPER_CPP_BASE_URL: ${HAI_WHISPER_CPP_BASE_URL:-http://whispercpp-runner:8080}
      HAI_WHISPER_CPP_TIMEOUT_SECONDS: ${HAI_WHISPER_CPP_TIMEOUT_SECONDS:-300}
      # Optional recovered runners. Every runner is disabled by default,
      # reachable only on a private Compose network, and retains no authority
      # outside its bounded backend adapter.
      HAI_GITLEAKS_ENABLED: ${HAI_GITLEAKS_ENABLED:-false}
      HAI_GITLEAKS_RUNNER_URL: ${HAI_GITLEAKS_RUNNER_URL:-http://gitleaks-runner:8080}
      HAI_GITLEAKS_RUNNER_TOKEN: ${HAI_GITLEAKS_RUNNER_TOKEN:-}
      HAI_GITLEAKS_WORKSPACES: ${HAI_GITLEAKS_WORKSPACES:-}
      HAI_GITLEAKS_TIMEOUT_SECONDS: ${HAI_GITLEAKS_TIMEOUT_SECONDS:-120}
      HAI_GOSEC_ENABLED: ${HAI_GOSEC_ENABLED:-false}
      HAI_GOSEC_RUNNER_URL: ${HAI_GOSEC_RUNNER_URL:-http://gosec-runner:8080}
      HAI_GOSEC_RUNNER_TOKEN: ${HAI_GOSEC_RUNNER_TOKEN:-}
      HAI_GOSEC_WORKSPACES: ${HAI_GOSEC_WORKSPACES:-}
      HAI_GOSEC_TIMEOUT_SECONDS: ${HAI_GOSEC_TIMEOUT_SECONDS:-120}
      HAI_GRYPE_ENABLED: ${HAI_GRYPE_ENABLED:-false}
      HAI_GRYPE_RUNNER_URL: ${HAI_GRYPE_RUNNER_URL:-http://grype-runner:8080}
      HAI_GRYPE_RUNNER_TOKEN: ${HAI_GRYPE_RUNNER_TOKEN:-}
      HAI_GRYPE_WORKSPACES: ${HAI_GRYPE_WORKSPACES:-}
      HAI_GRYPE_TIMEOUT_SECONDS: ${HAI_GRYPE_TIMEOUT_SECONDS:-120}
      HAI_SYFT_ENABLED: ${HAI_SYFT_ENABLED:-false}
      HAI_SYFT_RUNNER_URL: ${HAI_SYFT_RUNNER_URL:-http://syft-runner:8080}
      HAI_SYFT_RUNNER_TOKEN: ${HAI_SYFT_RUNNER_TOKEN:-}
      HAI_SYFT_WORKSPACES: ${HAI_SYFT_WORKSPACES:-}
      HAI_SYFT_TIMEOUT_SECONDS: ${HAI_SYFT_TIMEOUT_SECONDS:-120}
      HAI_TRIVY_ENABLED: ${HAI_TRIVY_ENABLED:-false}
      HAI_TRIVY_RUNNER_URL: ${HAI_TRIVY_RUNNER_URL:-http://trivy-runner:8080}
      HAI_TRIVY_RUNNER_TOKEN: ${HAI_TRIVY_RUNNER_TOKEN:-}
      HAI_TRIVY_WORKSPACES: ${HAI_TRIVY_WORKSPACES:-}
      HAI_TRIVY_TIMEOUT_SECONDS: ${HAI_TRIVY_TIMEOUT_SECONDS:-120}
      HAI_AGENT_FRAMEWORK_ENABLED: ${HAI_AGENT_FRAMEWORK_ENABLED:-false}
      HAI_AGENT_FRAMEWORK_BASE_URL: ${HAI_AGENT_FRAMEWORK_BASE_URL:-http://agent-framework-runner:8080}
      HAI_AGENT_FRAMEWORK_TIMEOUT_SECONDS: ${HAI_AGENT_FRAMEWORK_TIMEOUT_SECONDS:-120}
      HAI_CREWAI_ENABLED: ${HAI_CREWAI_ENABLED:-false}
      HAI_CREWAI_BASE_URL: ${HAI_CREWAI_BASE_URL:-http://crewai-runner:8080}
      HAI_CREWAI_TIMEOUT_SECONDS: ${HAI_CREWAI_TIMEOUT_SECONDS:-120}
      HAI_DOCLING_ENABLED: ${HAI_DOCLING_ENABLED:-false}
      HAI_DOCLING_RUNNER_URL: ${HAI_DOCLING_RUNNER_URL:-http://docling-runner:8080}
