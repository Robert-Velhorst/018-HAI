    ports:
      - "127.0.0.1:${BACKEND_PORT}:${SERVER_PORT}"
    volumes:
      - ./images:/root/images
      - ./automation-scripts:/root/automation-scripts:ro
      - ./connected-sources:/root/connected-sources:ro
      - ./agent-workspaces:/root/agent-workspaces
      - phase2-control-state:/var/lib/hai/phase2-state
      - ${CLOUDQUERY_SUMMARY_HOST_DIR:-./cloudquery-summary}:/cloudquery-summary:ro
    # /readyz, not a TCP probe: an open socket only proves the process is
    # listening. curl -f fails on the 503 that /readyz returns when a critical
    # dependency is unreachable, so `docker ps` stops reporting a backend with a
    # dead database as healthy.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${SERVER_PORT}/readyz"]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      # Three consecutive misses (~90s) prevent a brief local dependency stall
      # from flapping the stack while still surfacing sustained outages.
      # start_period covers the slower first boot while migrations run.
      retries: 3
      start_period: 40s
    networks:
      - service-hub
      - automation-hub-network
      - evidently-internal
      - guardrails-internal
      - lm-eval-internal
      - promptfoo-internal
      - deepteam-internal
      - deepeval-internal
      - garak-internal
      - whispercpp-internal
      - pydantic-ai-internal
      - fastmcp-internal
      - security-runners-internal
      - agent-runners-internal
      - document-runners-internal
      - coding-runners-internal

  frontend:
    <<: *hai-service-defaults
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 018-hai-frontend
    hostname: frontend
    restart: unless-stopped
    user: "101:101"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${FRONTEND_TMPFS_SIZE:-16m}
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-64m}
    mem_reservation: ${FRONTEND_MEMORY_RESERVATION:-8m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.25}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-32}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - service-hub

  browser-verifier:
    <<: *hai-service-defaults
    build:
      context: ./services/browser-verifier
      dockerfile: Dockerfile
    profiles: ["verification"]
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      HAI_PLAYWRIGHT_RUNNER_TOKEN: ${HAI_PLAYWRIGHT_RUNNER_TOKEN:-}
      HAI_PLAYWRIGHT_ALLOWED_ORIGINS: ${HAI_PLAYWRIGHT_ALLOWED_ORIGINS}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e 'fetch("http://127.0.0.1:8080/healthz").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - service-hub

  # These scanners operate only on operator-created disposable snapshots under
  # ./security-snapshots. They cannot inspect the repository, Docker socket,
  # connected sources, or host filesystem unless content is copied there.
  gitleaks-runner:
    <<: *hai-service-defaults
    build:
      context: ./services/gitleaks-runner
    profiles: ["security-scanning"]
    restart: unless-stopped
    environment:
      HAI_GITLEAKS_RUNNER_TOKEN: ${HAI_GITLEAKS_RUNNER_TOKEN:-}
      HAI_GITLEAKS_INPUT_ROOT: /inputs
      HAI_GITLEAKS_WORKSPACES: ${HAI_GITLEAKS_WORKSPACES:-}
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    volumes:
      - ./security-snapshots:/inputs:ro
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [security-runners-internal]

  gosec-runner:
    <<: *hai-service-defaults
    build:
      context: ./services/gosec-runner
    profiles: ["security-scanning"]
    restart: unless-stopped
    environment:
      HAI_GOSEC_RUNNER_TOKEN: ${HAI_GOSEC_RUNNER_TOKEN:-}
      HAI_GOSEC_INPUT_ROOT: /inputs
      HAI_GOSEC_WORKSPACES: ${HAI_GOSEC_WORKSPACES:-}
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    volumes:
      - ./security-snapshots:/inputs:ro
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 192
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [security-runners-internal]

  syft-runner:
    <<: *hai-service-defaults
    build:
      context: ./services/syft-runner
    profiles: ["security-scanning"]
    restart: unless-stopped
    environment:
      HAI_SYFT_RUNNER_TOKEN: ${HAI_SYFT_RUNNER_TOKEN:-}
      HAI_SYFT_INPUT_ROOT: /inputs
      HAI_SYFT_WORKSPACES: ${HAI_SYFT_WORKSPACES:-}
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    volumes:
      - ./security-snapshots:/inputs:ro
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 192
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
