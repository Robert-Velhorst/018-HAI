      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - deepteam-internal

  deepeval-runner:
    <<: *hai-service-defaults
    build:
      context: ./services/deepeval-runner
    profiles: ["deepeval-evaluation"]
    restart: unless-stopped
    environment:
      HAI_DEEPEVAL_MODEL_ID: ${HAI_DEEPEVAL_MODEL_ID:-}
      HAI_DEEPEVAL_MODEL_BASE_URL: ${HAI_DEEPEVAL_MODEL_BASE_URL:-}
      HAI_DEEPEVAL_MODEL_API_KEY: ${HAI_DEEPEVAL_MODEL_API_KEY:-}
      DEEPEVAL_DISABLE_DOTENV: "1"
      DEEPEVAL_DISABLE_LEGACY_KEYFILE: "1"
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    mem_limit: 1024m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - deepeval-internal

  garak-runner:
    <<: *hai-service-defaults
    build:
      context: ./services/garak-runner
    profiles: ["garak-evaluation"]
    restart: unless-stopped
    environment:
      HAI_GARAK_MODEL_ID: ${HAI_GARAK_MODEL_ID:-}
      HAI_GARAK_MODEL_BASE_URL: ${HAI_GARAK_MODEL_BASE_URL:-}
      HAI_GARAK_MODEL_API_KEY: ${HAI_GARAK_MODEL_API_KEY:-}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    mem_limit: 1024m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - garak-internal

  whispercpp-runner:
    <<: *hai-service-defaults
    build:
      context: ./services/whispercpp-runner
    profiles: ["local-transcription"]
    restart: unless-stopped
    environment:
      WHISPER_CPP_MODEL_FILE: ${WHISPER_CPP_MODEL_FILE:-}
      WHISPER_CPP_LANGUAGE: ${WHISPER_CPP_LANGUAGE:-auto}
      WHISPER_CPP_FILE_LIMIT: ${WHISPER_CPP_FILE_LIMIT:-25}
      WHISPER_CPP_MAX_AUDIO_BYTES: ${WHISPER_CPP_MAX_AUDIO_BYTES:-67108864}
      WHISPER_CPP_TIMEOUT_SECONDS: ${WHISPER_CPP_TIMEOUT_SECONDS:-180}
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=768m
    volumes:
      - ./connected-sources:/intake:ro
      - ./whisper-models:/models:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - whispercpp-internal

  wasi-runner:
    <<: *hai-service-defaults
    build:
      context: ./services/wasi-runner
    profiles: ["wasi"]
    restart: unless-stopped
    environment:
      HAI_WASI_RUNNER_TOKEN: ${HAI_WASI_RUNNER_TOKEN:-}
    volumes:
      - ./wasi-modules:/modules:ro
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()\""]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - service-hub

  # Optional, internal-only durable orchestration. It is intentionally split
  # from HAI's primary Postgres instance and is enabled only with
  # `--profile durability`. No Temporal port is exposed to the host.
  temporal-postgres:
    <<: *hai-service-defaults
    image: postgres:17-alpine
    profiles: ["durability"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${HAI_TEMPORAL_POSTGRES_PASSWORD:-temporal-local-only}
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - service-hub

  temporal-schema:
    <<: *hai-service-defaults
    image: temporalio/admin-tools:1.31.2
    profiles: ["durability"]
    restart: "no"
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB_PORT: 5432
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${HAI_TEMPORAL_POSTGRES_PASSWORD:-temporal-local-only}
      SQL_PASSWORD: ${HAI_TEMPORAL_POSTGRES_PASSWORD:-temporal-local-only}
    volumes:
      - ./services/temporal/setup-postgres.sh:/scripts/setup-postgres.sh:ro
    entrypoint: ["/bin/sh", "/scripts/setup-postgres.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - service-hub

  temporal:
    <<: *hai-service-defaults
    image: temporalio/server:1.31.2
    profiles: ["durability"]
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${HAI_TEMPORAL_POSTGRES_PASSWORD:-temporal-local-only}
      POSTGRES_SEEDS: temporal-postgres
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    expose:
      - "7233"
    volumes:
      - ./services/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - service-hub

  temporal-namespace:
    <<: *hai-service-defaults
    image: temporalio/admin-tools:1.31.2
    profiles: ["durability"]
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: ${HAI_TEMPORAL_NAMESPACE:-default}
    volumes:
      - ./services/temporal/create-namespace.sh:/scripts/create-namespace.sh:ro
    entrypoint: ["/bin/sh", "/scripts/create-namespace.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - service-hub

  postgres-idp:
    <<: *hai-service-defaults
    image: postgres:17-alpine@sha256:dc17045ccfd343b49600570ea734b9c4991cf1c3f3302e67df51e3b402dd55c4
    container_name: 018-hai-postgres-idp
    hostname: postgres-idp
    restart: unless-stopped
    init: true
    mem_limit: ${POSTGRES_IDP_MEMORY_LIMIT:-128m}
    mem_reservation: ${POSTGRES_IDP_MEMORY_RESERVATION:-24m}
    cpus: ${POSTGRES_IDP_CPU_LIMIT:-0.5}
    pids_limit: ${POSTGRES_IDP_PIDS_LIMIT:-64}
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    command:
      - postgres
      - -c
      - shared_buffers=16MB
      - -c
      - max_connections=16
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=8MB
      - -c
      - effective_cache_size=64MB
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${IDP_DB_NAME}
    ports:
      - "127.0.0.1:${IDP_DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-idp-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${IDP_DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - idp-network

  postgres-automation:
    <<: *hai-service-defaults
    # Pinned upstream pgvector Postgres 17 image. Existing data stays in the
    # named volume; take a backup before changing a live database image.
    image: pgvector/pgvector:0.8.5-pg17-bookworm@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    container_name: 018-hai-postgres-automation
    hostname: postgres-automation
    restart: unless-stopped
    init: true
    mem_limit: ${POSTGRES_AUTOMATION_MEMORY_LIMIT:-256m}
    mem_reservation: ${POSTGRES_AUTOMATION_MEMORY_RESERVATION:-64m}
    cpus: ${POSTGRES_AUTOMATION_CPU_LIMIT:-0.75}
    pids_limit: ${POSTGRES_AUTOMATION_PIDS_LIMIT:-96}
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=24
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=128MB
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${AUTOMATION_DB_NAME}
    ports:
      - "127.0.0.1:${AUTOMATION_DB_HOST_PORT:-5434}:5432"
    volumes:
      - postgres-automation-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${AUTOMATION_DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - automation-hub-network

  redis:
    <<: *hai-service-defaults
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: 018-hai-redis
    hostname: redis
    restart: unless-stopped
    init: true
    mem_limit: ${REDIS_MEMORY_LIMIT:-128m}
    mem_reservation: ${REDIS_MEMORY_RESERVATION:-16m}
    cpus: ${REDIS_CPU_LIMIT:-0.25}
    pids_limit: ${REDIS_PIDS_LIMIT:-32}
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    command:
      - redis-server
      - --port
      - ${REDIS_PORT}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1000"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:${REDIS_PORT}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      # Also on automation-hub-network so the backend can reach it: Redis was
      # previously idp-network only, unreachable from the backend, which is why
      # nothing but the IDP ever used it.
      - idp-network
      - automation-hub-network

  kafka:
    <<: *hai-service-defaults
    # HAI uses the Kafka protocol, but the local single-user broker is
    # Redpanda Community Edition. It avoids the Java/KRaft idle footprint
    # while retaining the same kafka:9092 contract for every existing client.
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1@sha256:9a47c1f8d6736f98fa2616f6f0b715c051cb0bdac1a1176e38321bf45a5b572d
    container_name: 018-hai-kafka
    hostname: kafka
    restart: unless-stopped
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    mem_limit: ${KAFKA_MEMORY_LIMIT:-256m}
    mem_reservation: ${KAFKA_MEMORY_RESERVATION:-64m}
    cpus: ${KAFKA_CPU_LIMIT:-0.5}
    pids_limit: ${KAFKA_PIDS_LIMIT:-96}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://kafka:9092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - kafka:33145
      - --smp
      - "1"
      # Docker Desktop shares fractional CPU with the rest of Windows. Let
      # Seastar sleep instead of busy-polling while preserving fsync durability.
      - --overprovisioned=true
      - --unsafe-bypass-fsync=false
      - --lock-memory=false
      - --reserve-memory
      - 0M
      - --check=false
      - --default-log-level
      - warn
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=127.0.0.1:9092"]
      interval: 30s
      timeout: 5s
      retries: 18
      start_period: 15s
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - service-hub

  generic-auto:
    <<: *hai-service-defaults
    profiles: ["compatibility"]
    build:
      context: ./generic-auto
      dockerfile: dockerfile
    container_name: 018-hai-generic-auto
    restart: unless-stopped
    user: "65532:65532"
    init: true
    read_only: true
    mem_limit: ${GENERIC_AUTO_MEMORY_LIMIT:-32m}
    mem_reservation: ${GENERIC_AUTO_MEMORY_RESERVATION:-6m}
    cpus: ${GENERIC_AUTO_CPU_LIMIT:-0.1}
    pids_limit: ${GENERIC_AUTO_PIDS_LIMIT:-16}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - service-hub

networks:
  idp-network:
    name: 018-hai-idp-network
    driver: bridge
  automation-hub-network:
    name: 018-hai-automation-hub-network
