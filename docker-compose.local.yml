  nginx:
    <<: *hai-service-defaults
    image: nginx:stable-alpine-slim@sha256:ddde39c6e51f02fde7410c2e9c234cf2d0a4c7bdbbe176aeb37d8ad7ab4eb58c
    container_name: gateway
    hostname: gateway
    restart: unless-stopped
    user: "101:101"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${GATEWAY_TMPFS_SIZE:-32m}
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-64m}
    mem_reservation: ${GATEWAY_MEMORY_RESERVATION:-16m}
    cpus: ${GATEWAY_CPU_LIMIT:-0.25}
    pids_limit: ${GATEWAY_PIDS_LIMIT:-32}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      BACKEND_API_SHARED_KEY: ${BACKEND_API_SHARED_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        envsubst '$$BACKEND_API_SHARED_KEY' < /etc/nginx/nginx.conf.template > /tmp/nginx.conf
        exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      idp:
        condition: service_healthy
    ports:
      - "${GATEWAY_HOST_BIND:-127.0.0.1}:${GATEWAY_HOST_PORT:-8088}:8080"
    volumes:
      - ./nginx-config/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx-config/sites-enabled:/etc/nginx/sites-enabled:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - service-hub

  # Explicit opt-in public HTTPS tunnel. Start it only through
  # scripts/start-ngrok.ps1, whose preflight rejects local-login bypass,
  # insecure cookies, placeholder secrets, and mismatched OAuth callbacks.
  # The inspector/API is reachable only inside this container.
  ngrok:
    <<: *hai-service-defaults
    image: ngrok/ngrok:alpine@sha256:85bea0e9c697bdad142b09cd9704420812cc44b5ae417ec4c7ac74d0a49d72f2
    profiles: ["cloud-tunnel"]
    container_name: 018-hai-ngrok
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      HAI_NGROK_URL: ${HAI_NGROK_URL:-}
      RUN_MODE: ${RUN_MODE:-production}
      LOCAL_LOGIN_BYPASS_ENABLED: ${LOCAL_LOGIN_BYPASS_ENABLED:-false}
      IDP_COOKIE_SECURE: ${IDP_COOKIE_SECURE:-false}
      GATEWAY_HOST_BIND: ${GATEWAY_HOST_BIND:-127.0.0.1}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-0}
      HAI_A2A_BRIDGE_ENABLED: ${HAI_A2A_BRIDGE_ENABLED:-false}
      HAI_A2A_BRIDGE_PUBLIC_NGROK_ENABLED: ${HAI_A2A_BRIDGE_PUBLIC_NGROK_ENABLED:-false}
      HAI_A2A_BRIDGE_TOKEN: ${HAI_A2A_BRIDGE_TOKEN:-}
      HAI_A2A_BRIDGE_OWNER_ID: ${HAI_A2A_BRIDGE_OWNER_ID:-}
      HAI_A2A_BRIDGE_URL: ${HAI_A2A_BRIDGE_URL:-http://127.0.0.1/api/v1/a2a}
    entrypoint: ["/bin/sh", "/etc/hai/start-ngrok.sh"]
    volumes:
      - ./deploy/ngrok/ngrok.yml:/etc/ngrok.yml:ro
      - ./deploy/ngrok/start-ngrok.sh:/etc/hai/start-ngrok.sh:ro
      - ./deploy/ngrok/public-policy.yml:/etc/hai/public-policy.yml:ro
      - ./deploy/ngrok/private-a2a-policy.yml:/etc/hai/private-a2a-policy.yml:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4040/api/endpoints | grep -q '\"url\"'"]
      interval: 30s
      start_interval: 2s
