      OUTCOME_MONITOR_SWEEP_SECONDS: ${OUTCOME_MONITOR_SWEEP_SECONDS:-300}
      OUTCOME_MONITOR_POLL_SECONDS: ${OUTCOME_MONITOR_POLL_SECONDS:-300}
      OUTCOME_MONITOR_LEASE_SECONDS: ${OUTCOME_MONITOR_LEASE_SECONDS:-120}
      OUTCOME_MONITOR_SCOPE_LIMIT: ${OUTCOME_MONITOR_SCOPE_LIMIT:-50}
      OUTCOME_MONITOR_BATCH_LIMIT: ${OUTCOME_MONITOR_BATCH_LIMIT:-20}
      AUTONOMY_WORLD_STATE_TTL_SECONDS: ${AUTONOMY_WORLD_STATE_TTL_SECONDS}
      AUTONOMY_TELEMETRY_LIMIT: ${AUTONOMY_TELEMETRY_LIMIT}
      LLM_KV_CACHE_LOAD_STRATEGY: ${LLM_KV_CACHE_LOAD_STRATEGY}
      LLM_DUALPATH_INFRASTRUCTURE_VERIFIED: ${LLM_DUALPATH_INFRASTRUCTURE_VERIFIED}
      # Langfuse is opt-in and can export only the bounded aggregate evidence
      # defined by its backend adapter; no credential is present by default.
      HAI_LANGFUSE_ENABLED: ${HAI_LANGFUSE_ENABLED:-false}
      HAI_LANGFUSE_BASE_URL: ${HAI_LANGFUSE_BASE_URL:-}
      HAI_LANGFUSE_PUBLIC_KEY: ${HAI_LANGFUSE_PUBLIC_KEY:-}
      HAI_LANGFUSE_SECRET_KEY: ${HAI_LANGFUSE_SECRET_KEY:-}
      HAI_LANGFUSE_TIMEOUT_SECONDS: ${HAI_LANGFUSE_TIMEOUT_SECONDS:-8}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:${SERVER_PORT}"
    volumes:
      - ./images:/root/images
      - ./automation-scripts:/root/automation-scripts:ro
      - ./connected-sources:/root/connected-sources:ro
      - ./agent-workspaces:/root/agent-workspaces
      - ./phase2-feeds:/root/phase2-feeds:ro
      - phase2-control-state:/root/phase2-control-state
      - ${CLOUDQUERY_SUMMARY_HOST_DIR:-./cloudquery-summary}:/cloudquery-summary:ro
    # The API writes only to the explicit media/workspace/control mounts above.
    # Keep its image filesystem immutable and remove ambient kernel privileges;
    # host execution remains separately approval- and allowlist-gated.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # /readyz, not a TCP probe: an open socket only proves the process is
    # listening. curl -f fails on the 503 that /readyz returns when a critical
    # dependency is unreachable, so `docker ps` stops reporting a backend with a
    # dead database as healthy.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${SERVER_PORT}/readyz > /dev/null"]
      interval: 10s
      timeout: 5s
      # 3 strikes (~30s) before unhealthy: long enough to ride out a dependency
      # blip, short enough that a real outage is reflected quickly. start_period
      # still covers the slower first boot while migrations run.
      retries: 3
      start_period: 40s
    networks:
      - service-hub
      - automation-hub-network
      - evidently-internal
      - guardrails-internal
      - lm-eval-internal
      - promptfoo-internal
      - deepteam-internal
      - deepeval-internal
      - garak-internal
      - whispercpp-internal
      - pydantic-ai-internal
      - fastmcp-internal
      - security-runners-internal
      - agent-runners-internal
      - document-runners-internal
      - coding-runners-internal
      - a2a-local
      - host-runtime-internal
      - searxng-backend

  # Optional local source discovery. HAI reaches this service over an
  # internal-only network; SearXNG has separate egress for search providers.
  # It returns candidates only and has no published host port.
  searxng:
    image: ghcr.io/searxng/searxng:2026.10.9-f4822b3fc
    profiles: ["research-discovery"]
    restart: unless-stopped
    environment:
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
      SEARXNG_LIMITER: "false"
      SEARXNG_IMAGE_PROXY: "false"
      SEARXNG_SECRET: ${HAI_SEARXNG_SECRET}
      FORCE_OWNERSHIP: "false"
    expose:
      - "8080"
    volumes:
      - ./services/searxng:/etc/searxng:ro
      - searxng-cache:/var/cache/searxng
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/searxng/.venv/bin/python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()\""]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - searxng-backend
      - searxng-egress

  # Schema migration is a separate, owner-credentialed one-shot job. The API
  # process is never the default migration runner.
  backend-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    mem_limit: ${BACKEND_MIGRATE_MEMORY_LIMIT:-512m}
    cpus: ${BACKEND_MIGRATE_CPU_LIMIT:-1.0}
    pids_limit: ${BACKEND_MIGRATE_PIDS_LIMIT:-128}
    depends_on:
      postgres-automation:
        condition: service_healthy
    command: ["/app/app", "migrate", "up"]
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${AUTOMATION_DB_NAME}
      DB_HOST: ${AUTOMATION_DB_HOST}
      DB_PORT: ${DB_PORT}
      RUN_MODE: ${RUN_MODE:-production}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      # Plaintext is allowed only for this local Compose Postgres host; remote
      # production database hosts still require verify-ca or verify-full.
      HAI_LOCAL_COMPOSE_DATABASE: "true"
      DB_AUTOMIGRATE: ${DB_AUTOMIGRATE:-false}
      DB_MIGRATIONS_ENABLED: "false"
      HAI_COMMAND_TIMEOUT: ${HAI_COMMAND_TIMEOUT:-30m}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-8}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-2}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-2m}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5s}
      DB_OPEN_TIMEOUT: ${DB_OPEN_TIMEOUT:-10s}
      HAI_SEMANTIC_RETRIEVAL_ENABLED: ${HAI_SEMANTIC_RETRIEVAL_ENABLED:-false}
      # Application configuration validates the image directory before the
      # migrate command dispatches. The one-shot service has a read-only root,
      # so keep that harmless bootstrap directory on its private tmpfs.
      IMAGE_SAVE_DIR: /tmp/images
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - automation-hub-network

  # Existing named volumes may retain root-owned state from older backend
  # images. Change ownership only; do not replace or rewrite any file content.
  backend-state-permissions:
    image: "${COMPOSE_PROJECT_NAME:-hai}-backend:local"
    user: "0:0"
    entrypoint: ["/usr/bin/chown"]
    command: ["-R", "--no-dereference", "10001:10001", "/root/phase2-control-state"]
    restart: "no"
    mem_limit: 64m
    cpus: 0.10
    pids_limit: 16
    network_mode: none
    volumes:
      - phase2-control-state:/root/phase2-control-state
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN

  # Runs after migrations so grants cover every current table, and records
  # default privileges for all future tables created by the schema owner.
  backend-runtime-role:
    image: postgres:17-alpine
    restart: "no"
    mem_limit: ${BACKEND_RUNTIME_ROLE_MEMORY_LIMIT:-64m}
    cpus: ${BACKEND_RUNTIME_ROLE_CPU_LIMIT:-0.1}
    pids_limit: ${BACKEND_RUNTIME_ROLE_PIDS_LIMIT:-32}
    depends_on:
      postgres-automation:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: ${AUTOMATION_DB_HOST}
      PGPORT: ${DB_PORT}
      PGDATABASE: ${AUTOMATION_DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      HAI_RUNTIME_DB_USER: ${BACKEND_DB_USER:-hai_runtime}
      HAI_RUNTIME_DB_PASSWORD: ${BACKEND_DB_PASSWORD:-${DB_PASSWORD}}
    command: ["/bin/sh", "/scripts/provision-runtime-role.sh"]
    volumes:
      - ./services/postgres-runtime-role/provision-runtime-role.sh:/scripts/provision-runtime-role.sh:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - automation-hub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 018-hai-frontend
    hostname: frontend
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-128m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.25}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-64}
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - service-hub

  browser-verifier:
    build:
      context: ./services/browser-verifier
      dockerfile: Dockerfile
    profiles: ["verification"]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      HAI_PLAYWRIGHT_RUNNER_TOKEN: ${HAI_PLAYWRIGHT_RUNNER_TOKEN:-}
      HAI_PLAYWRIGHT_ALLOWED_ORIGINS: ${HAI_PLAYWRIGHT_ALLOWED_ORIGINS}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e 'fetch("http://127.0.0.1:8080/healthz").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - service-hub

  # These scanners operate only on operator-created disposable snapshots under
  # ./security-snapshots. They cannot inspect the repository, Docker socket,
  # connected sources, or host filesystem unless content is copied there.
  gitleaks-runner:
    build:
      context: ./services/gitleaks-runner
    profiles: ["security-scanning"]
    restart: unless-stopped
    environment:
      HAI_GITLEAKS_RUNNER_TOKEN: ${HAI_GITLEAKS_RUNNER_TOKEN:-}
      HAI_GITLEAKS_INPUT_ROOT: /inputs
      HAI_GITLEAKS_WORKSPACES: ${HAI_GITLEAKS_WORKSPACES:-}
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    volumes:
      - ./security-snapshots:/inputs:ro
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [security-runners-internal]

  gosec-runner:
    build:
      context: ./services/gosec-runner
    profiles: ["security-scanning"]
    restart: unless-stopped
    environment:
      HAI_GOSEC_RUNNER_TOKEN: ${HAI_GOSEC_RUNNER_TOKEN:-}
      HAI_GOSEC_INPUT_ROOT: /inputs
      HAI_GOSEC_WORKSPACES: ${HAI_GOSEC_WORKSPACES:-}
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    volumes:
      - ./security-snapshots:/inputs:ro
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 192
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [security-runners-internal]

  syft-runner:
    build:
      context: ./services/syft-runner
    profiles: ["security-scanning"]
    restart: unless-stopped
    environment:
      HAI_SYFT_RUNNER_TOKEN: ${HAI_SYFT_RUNNER_TOKEN:-}
      HAI_SYFT_INPUT_ROOT: /inputs
      HAI_SYFT_WORKSPACES: ${HAI_SYFT_WORKSPACES:-}
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    volumes:
      - ./security-snapshots:/inputs:ro
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 192
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [security-runners-internal]

  grype-runner:
    build:
      context: ./services/grype-runner
    profiles: ["security-scanning"]
    restart: unless-stopped
    environment:
      HAI_GRYPE_RUNNER_TOKEN: ${HAI_GRYPE_RUNNER_TOKEN:-}
      HAI_GRYPE_INPUT_ROOT: /inputs
      HAI_GRYPE_DB_ROOT: /grype-db
      HAI_GRYPE_WORKSPACES: ${HAI_GRYPE_WORKSPACES:-}
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    volumes:
      - ./security-snapshots:/inputs:ro
      - ./grype-db:/grype-db:ro
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 192
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [security-runners-internal]

  trivy-runner:
    build:
      context: ./services/trivy-runner
    profiles: ["security-scanning"]
    restart: unless-stopped
    environment:
      HAI_TRIVY_RUNNER_TOKEN: ${HAI_TRIVY_RUNNER_TOKEN:-}
      HAI_TRIVY_INPUT_ROOT: /inputs
      HAI_TRIVY_WORKSPACES: ${HAI_TRIVY_WORKSPACES:-}
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=384m"]
    volumes:
      - ./security-snapshots:/inputs:ro
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 192
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [security-runners-internal]

  # One private Ollama instance supports only disposable patch proposals. It
  # publishes no host port. Model tags are pulled by HAI's dedicated mini-SWE
  # maintenance gate before use; image upgrades remain an operator action.
  ollama-miniswe:
    image: ${HAI_RUNNER_OLLAMA_IMAGE:-ollama/ollama:0.11.10}
    profiles: ["patch-proposals"]
    restart: unless-stopped
    expose: ["11434"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m"]
    volumes:
      - runner-ollama-data:/root/.ollama
    mem_limit: 6g
    cpus: 4.0
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    networks: [coding-runners-internal]

  agent-framework-runner:
    build:
      context: ./services/agent-framework-runner
    profiles: ["agent-framework-planning"]
    restart: unless-stopped
    environment:
      HAI_AGENT_FRAMEWORK_LOCAL_MODEL_BASE_URL: ${HAI_AGENT_FRAMEWORK_LOCAL_MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      HAI_AGENT_FRAMEWORK_LOCAL_MODEL_ID: ${HAI_AGENT_FRAMEWORK_LOCAL_MODEL_ID:-}
      HAI_AGENT_FRAMEWORK_LOCAL_MODEL_API_KEY: ${HAI_AGENT_FRAMEWORK_LOCAL_MODEL_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 192
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [agent-runners-internal]

  crewai-runner:
    build:
      context: ./services/crewai-runner
    profiles: ["crewai-planning"]
    restart: unless-stopped
    environment:
      HAI_CREWAI_LOCAL_MODEL_BASE_URL: ${HAI_CREWAI_LOCAL_MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      HAI_CREWAI_LOCAL_MODEL_ID: ${HAI_CREWAI_LOCAL_MODEL_ID:-}
      HAI_CREWAI_LOCAL_MODEL_API_KEY: ${HAI_CREWAI_LOCAL_MODEL_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 192
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [agent-runners-internal]

  docling-runner:
    build:
      context: ./services/docling-runner
    profiles: ["local-document-extraction"]
    restart: unless-stopped
    environment:
      HAI_DOCLING_RUNNER_TOKEN: ${HAI_DOCLING_RUNNER_TOKEN:-}
      HAI_DOCLING_INPUT_ROOT: /intake
      HAI_DOCLING_ARTIFACTS_ROOT: /models
      HAI_DOCLING_PDF_ENABLED: ${HAI_DOCLING_PDF_ENABLED:-false}
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=1g"]
    volumes:
      - ./connected-sources:/intake:ro
      - ./docling-models:/models:ro
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [document-runners-internal]

  miniswe-runner:
    build:
      context: ./services/miniswe-runner
    profiles: ["patch-proposals"]
    restart: unless-stopped
    depends_on:
      ollama-miniswe:
        condition: service_healthy
    environment:
      HAI_MINISWE_RUNNER_TOKEN: ${HAI_MINISWE_RUNNER_TOKEN:-}
      HAI_MINISWE_OLLAMA_BASE_URL: http://ollama-miniswe:11434
      HAI_MINISWE_MODEL_ID: ${HAI_MINISWE_MODEL_ID:-}
      HAI_MINISWE_INPUT_ROOT: /inputs
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=1g"]
    volumes:
      - ./mini-swe-workspaces:/inputs:ro
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [coding-runners-internal]

  nginx:
    image: nginx:alpine
    container_name: gateway
    hostname: gateway
    restart: unless-stopped
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-128m}
    cpus: ${GATEWAY_CPU_LIMIT:-0.25}
    pids_limit: ${GATEWAY_PIDS_LIMIT:-64}
    environment:
      BACKEND_API_SHARED_KEY: ${BACKEND_API_SHARED_KEY}
      LOCAL_PREVIEW_GATEWAY_SECRET: ${LOCAL_PREVIEW_GATEWAY_SECRET:-}
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        # The rendered config contains gateway credentials; keep it readable
        # only by the root Nginx master that loads it.
        umask 077
        if [ -n "$$LOCAL_PREVIEW_GATEWAY_SECRET" ]; then
          case "$$LOCAL_PREVIEW_GATEWAY_SECRET" in *[!0-9a-f]*) echo 'invalid local preview gateway secret' >&2; exit 1 ;; esac
          [ "$${#LOCAL_PREVIEW_GATEWAY_SECRET}" -eq 64 ] || { echo 'invalid local preview gateway secret length' >&2; exit 1; }
        fi
        envsubst '$$BACKEND_API_SHARED_KEY $$LOCAL_PREVIEW_GATEWAY_SECRET' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      idp:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8088}:80"
    volumes:
      - ./nginx-config/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx-config/sites-enabled:/etc/nginx/sites-enabled:ro
    healthcheck:
      # A served Angular shell does not prove the API or identity provider is
      # ready. Probe both existing unauthenticated readiness routes through
      # Nginx so container health reflects the dashboard's control plane.
      test: ["CMD-SHELL", "wget -q -O /dev/null --timeout=3 http://127.0.0.1/readyz && wget -q -O /dev/null --timeout=3 http://127.0.0.1/_hai/idp-readyz"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s
    networks:
      - service-hub

  # Local A2A is deliberately isolated from the browser gateway and the ngrok
  # tunnel. It only exposes the Agent Card and planning JSON-RPC route through
  # a loopback host port when an operator explicitly enables this profile.
  a2a-gateway:
    image: nginx:alpine
    profiles: ["local-a2a"]
    container_name: 018-hai-a2a-gateway
    restart: unless-stopped
    user: "nginx"
    # The Go API listens for SIGINT and uses it to drain HTTP requests and stop
    # bounded background schedulers before Docker replaces the container.
    stop_signal: SIGINT
    stop_grace_period: 25s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: 0.10
    pids_limit: 32
    environment:
      BACKEND_API_SHARED_KEY: ${BACKEND_API_SHARED_KEY}
    command:
      - /bin/sh
      - -c
      - umask 077; envsubst '$$BACKEND_API_SHARED_KEY' < /etc/nginx/a2a-local.conf.template > /tmp/nginx.conf && exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HAI_A2A_LOCAL_PORT:-8091}:8080"
    volumes:
      - ./nginx-config/a2a-local.conf.template:/etc/nginx/a2a-local.conf.template:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=700
      - /var/cache/nginx:rw,noexec,nosuid,size=4m,uid=101,gid=101,mode=700
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/.well-known/agent-card.json || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - a2a-local

  # This gateway is deliberately separate from the browser and ngrok gateway.
  # The native Windows DSH bridge polls it through a loopback host port and it
  # forwards only the host-runtime lease lifecycle endpoints to the backend.
  host-runtime-gateway:
    image: nginx:alpine
    profiles: ["local-host-runtime"]
    container_name: 018-hai-host-runtime-gateway
    restart: unless-stopped
    user: "nginx"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: 0.10
    pids_limit: 32
    environment:
      BACKEND_API_SHARED_KEY: ${BACKEND_API_SHARED_KEY}
    command:
      - /bin/sh
      - -c
      - umask 077; envsubst '$$BACKEND_API_SHARED_KEY' < /etc/nginx/host-runtime.conf.template > /tmp/nginx.conf && exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HAI_HOST_RUNTIME_BRIDGE_PORT:-8092}:8080"
    volumes:
      - ./nginx-config/host-runtime.conf.template:/etc/nginx/host-runtime.conf.template:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=700
      - /var/cache/nginx:rw,noexec,nosuid,size=4m,uid=101,gid=101,mode=700
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
